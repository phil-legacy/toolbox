<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fluid Power</title>
<meta name="description" content="Draw pneumatic circuits from an ISO 1219 component library and watch them run: pressures, flows, cylinders, valves and the displacement-step diagram.">
<style>
/* Layout: library left, schematic canvas centre, inspector right, displacement-step diagram below. */
:root{--bg:#eef1f3;--panel:#fbfcfc;--ink:#17232b;--muted:#5d6c76;--line:#c9d2d8;--accent:#0b6e8f;--run:#c77700;--yes:#1d7a46;--no:#b3362b;
 --sheet:#ffffff;--grid:#e3e8ec;--sel:#0b6e8f;
 --p0:#8a979f;--p1:#9fc1e6;--p2:#6aa3dd;--p3:#3d84d1;--p4:#1f67bf;--p5:#0d4aa0;
 --c0:#ffffff;--c1:#e3eefa;--c2:#c6dcf4;--c3:#a3c6ee;--c4:#7eafe6;--c5:#5a95dc;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
 color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11181d;--panel:#182127;--ink:#dfe6ea;--muted:#93a3ad;--line:#33424c;--accent:#3fa7c9;--run:#e39a2b;--yes:#41b06e;--no:#e0665a;
 --sheet:#141c21;--grid:#1f2a31;--sel:#3fa7c9;
 --p0:#6d7c86;--p1:#3e6996;--p2:#4a82bf;--p3:#5d9ae0;--p4:#7db4f0;--p5:#a5cdf7;
 --c0:#141c21;--c1:#1a2a3a;--c2:#1e3550;--c3:#244468;--c4:#2b5584;--c5:#3367a3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11181d;--panel:#182127;--ink:#dfe6ea;--muted:#93a3ad;--line:#33424c;--accent:#3fa7c9;--run:#e39a2b;--yes:#41b06e;--no:#e0665a;
 --sheet:#141c21;--grid:#1f2a31;--sel:#3fa7c9;
 --p0:#6d7c86;--p1:#3e6996;--p2:#4a82bf;--p3:#5d9ae0;--p4:#7db4f0;--p5:#a5cdf7;
 --c0:#141c21;--c1:#1a2a3a;--c2:#1e3550;--c3:#244468;--c4:#2b5584;--c5:#3367a3;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);display:flex;flex-direction:column;
 padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;min-height:30px}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button.run{border-color:var(--run);color:var(--run)}
button.run.on{background:var(--run);color:#fff}
button:disabled{opacity:.45;cursor:default}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-height:30px}
header.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header.top h1{margin:0;font:600 17px var(--mono);border:1.5px solid var(--ink);border-radius:3px;padding:2px 10px;white-space:nowrap}
header.top h1 span{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
#pname{width:150px}
.spacer{flex:1}
.mode{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.mode button{border:0;border-radius:0;min-width:84px}
#main{flex:1;display:grid;grid-template-columns:230px minmax(0,1fr);min-height:0;position:relative}
body.libc #main{grid-template-columns:34px minmax(0,1fr)}
#lib{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;min-height:0}
#libTop{display:flex;gap:4px;align-items:center;margin:10px 8px 4px}
#libTop .techtabs{flex:1;margin:0}
#bLib{min-height:0;width:26px;height:28px;padding:0;flex:none}
body.libc #libTop .techtabs,body.libc #libBody{display:none}
body.libc #libTop{margin:8px 4px}
/* floating inspector: dragged by its title bar, folded to its title when nothing is selected */
#side{position:absolute;z-index:40;width:290px;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 22px rgba(0,0,0,.16);display:flex;flex-direction:column;max-height:calc(100% - 16px)}
#sideHead{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:move;border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:none}
#sideHead .ptitle{margin:0;flex:1}
#sideTag{font:600 13px var(--mono);color:var(--ink)}
#bFold{min-height:0;width:26px;height:24px;padding:0}
#side.folded #insp{display:none}
#side.folded #sideHead{border-bottom:0}
#insp{overflow-y:auto;overflow-x:hidden}
#bChecks{font-size:13px}
#bChecks.w{color:var(--run);border-color:var(--run)}
#bChecks.e{color:var(--no);border-color:var(--no)}
#checksPop{position:absolute;z-index:60;width:360px;max-width:calc(100vw - 16px);max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:8px 4px}
#checksPop[hidden]{display:none}
.ptitle{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 12px 6px}
.techtabs{display:flex;gap:4px;margin:10px 10px 4px}
.techtabs button{flex:1;font-size:13px}
.cat{margin:4px 8px 8px}
.cat h3{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:10px 4px 4px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);padding:4px 2px;cursor:pointer;min-height:72px;position:relative;text-align:center;min-width:0}
.item:hover,.item.on{border-color:var(--accent)}
.item.on{box-shadow:0 0 0 2px var(--accent) inset}
.item svg{width:100%;max-width:96px;height:44px}
.item span{font-size:11px;line-height:1.2;color:var(--ink)}
.item .q{position:absolute;top:2px;right:2px;width:18px;height:18px;min-height:0;padding:0;font-size:11px;line-height:16px;border-radius:50%;color:var(--muted)}
.soon{margin:8px 12px;color:var(--muted);font-size:13px}
#canvasWrap{position:relative;overflow:auto;background:var(--sheet);min-height:0}
#svg{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
body.sim #svg{touch-action:pan-x pan-y}
#zoombar{position:sticky;left:8px;top:8px;float:left;z-index:5;display:flex;gap:4px;margin:8px}
#zoombar button{min-height:28px;padding:2px 8px;background:var(--panel)}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:12px var(--mono);box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:50;white-space:nowrap}
#insp{padding:0 12px 12px}
#insp select,#insp input{min-width:0;max-width:100%}
#insp .row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px;align-items:center;margin:6px 0}
#insp label{font-size:12.5px;color:var(--muted)}
#insp input[type=range]{width:100%}
#insp .hint{font-size:12.5px;color:var(--muted);margin:6px 0}
#insp h4{margin:10px 0 4px;font:600 14px var(--mono)}
#insp .live{color:var(--run);font-size:11px;margin-left:4px}
#checks{padding:0 12px 12px}
#checks li{margin:4px 0;cursor:pointer;font-size:13px}
#checks ul{padding-left:18px;margin:4px 0}
#checks .ok{color:var(--yes);font-size:13px}
.w{color:var(--run)} .e{color:var(--no)}
#status{padding:4px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--panel);min-height:26px}
#status.err{color:var(--no)}
.menu{max-height:80vh;overflow:auto;position:absolute;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:6px;min-width:240px}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px}
.menu button:hover{background:var(--bg)}
.menu small{display:block;color:var(--muted);font-size:12px}
.dlg{position:fixed;inset:0;background:rgba(10,20,25,.35);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.dlg>div{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:16px 20px}
.dlg h2{margin:0 0 8px;font:600 17px var(--mono)}
.dlg h3{margin:14px 0 4px;font:600 14px var(--sans)}
.dlg p,.dlg li{max-width:65ch}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.card svg{width:100%;max-width:260px;height:120px;background:var(--sheet);border:1px solid var(--line);border-radius:4px}
.small{font-size:12.5px;color:var(--muted)}
kbd{font:12px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--bg)}
/* SVG symbols */
.sym{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.symf{fill:var(--ink);stroke:none}
.box{fill:var(--sheet);stroke:var(--ink);stroke-width:1.3}
.pin{stroke:var(--ink);stroke-width:1.3}
.pt{font:10px var(--mono);fill:var(--muted)}
.tag{font:600 11px var(--mono);fill:var(--ink)}
.val{font:600 10.5px var(--mono);fill:var(--accent)}
.lbl{font:10px var(--sans);fill:var(--muted)}
.port{fill:var(--sheet);stroke:var(--muted);stroke-width:1}
.port.open{stroke:var(--run)}
body.sim .port{display:none}
.pipe{fill:none;stroke-width:1.6;stroke-linejoin:round}
.pipe.pilot{stroke-dasharray:5 3}
.pipehit{fill:none;stroke:transparent;stroke-width:10}
.selc{fill:none;stroke:var(--sel);stroke-width:1;stroke-dasharray:4 3}
.selp{stroke:var(--sel)!important}
.wp{fill:var(--sel);stroke:none}
.hot{cursor:pointer}
.hot:hover .sym,.hot:hover .box{stroke:var(--accent)}
.coil.onn{fill:var(--run)}
.lamp{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
.lamp.onn{fill:var(--yes)}
.flow{fill:var(--accent)}
.band{fill:var(--grid);stroke:none}
.hitr{fill:transparent;stroke:none}
.cham{stroke:none;fill:var(--c0)}
@media (max-width:900px){
 html,body{height:auto}
 body{display:block}
 #main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 60vh}
 body.libc #main{grid-template-columns:minmax(0,1fr)}
 body.libc #libBody{display:none}
 #lib{max-height:260px}
 #canvasWrap{height:60vh}
 #lib{border-right:0;border-bottom:1px solid var(--line);max-height:none;overflow-x:auto}
 #lib .cats{display:flex;gap:6px;overflow-x:auto;padding:0 8px 8px}
 #lib .cat{margin:0;flex:none}
 #lib .items{grid-template-columns:repeat(6,92px)}
 #pname{width:110px}
 #side{position:fixed;left:8px!important;right:8px;top:auto!important;bottom:36px;width:auto;max-height:50vh!important}
 #sideHead{cursor:pointer}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
 <h1>Fluid Power<span id="ver"></span></h1>
 <div class="grp">
  <input id="pname" type="text" aria-label="Project name" value="Project1">
  <button id="bNew" title="Start an empty project">New</button>
  <button id="bEx" title="Open an example circuit">Examples ▾</button>
  <button id="bOpen" title="Open a project file (.json)">Open</button>
  <button id="bSave" title="Save the project (.json)">Save</button>
  <button id="bImg" title="Image of the schematic">Image ▾</button>
  <button id="bPdf" title="Printable PDF with title block and parts list">PDF…</button>
 </div>
 <span class="sep"></span>
 <div class="mode" role="group" aria-label="Mode">
  <button id="mEdit" class="on">Edit</button><button id="mSim">Simulate</button>
 </div>
 <div class="grp" id="simbar">
  <button id="bRun" class="run" title="Run / pause (Space)">▶ Run</button>
  <button id="bStep" title="Advance 10 ms">Step</button>
  <button id="bReset" title="Back to the start: pressures at 0, cylinders retracted">Reset</button>
  <select id="speed" aria-label="Simulation speed"><option value="1">×1</option><option value="0.25">×¼ slow</option><option value="0.1">×⅒ slow</option><option value="0.02">×1/50 slow</option></select>
  <button id="bCurves" title="Open the curves in their own window: cylinder strokes, pressures, coils, sensors">Curves ⧉</button>
  <span id="clock" class="small" style="font-family:var(--mono)">t = 0.00 s</span>
 </div>
 <span class="spacer"></span>
 <button id="bChecks" title="Remarks on the drawing">Checks</button>
 <button id="bHelp" title="About and help" aria-label="About and help">?</button>
</header>
<div id="main">
 <aside id="lib">
  <div id="libTop"><div class="techtabs"><button id="tPn" class="on">Pneumatic</button><button id="tHy">Hydraulic</button></div><button id="bLib" title="Hide the library" aria-label="Hide the library">◀</button></div>
  <div id="libBody"></div>
 </aside>
 <div id="canvasWrap">
  <div id="zoombar"><button id="zOut" aria-label="Zoom out">−</button><button id="zFit" title="Fit the schematic">Fit</button><button id="zIn" aria-label="Zoom in">+</button></div>
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
 </div>
 <aside id="side" class="folded">
  <div id="sideHead"><span class="ptitle">Inspector</span><span id="sideTag"></span><button id="bFold" title="Fold / unfold" aria-label="Fold or unfold the inspector">▾</button></div>
  <div id="insp"></div>
 </aside>
 <div id="checksPop" hidden><div id="checks"></div></div>
</div>

<div id="status" role="status">Ready.</div>
<div id="tip" hidden></div>
<input id="fileIn" type="file" accept=".json,application/json" hidden>

function drawValve(c,st,E){

/* ===== cylinders (linear, rotary, gripper) ===== */
function hasRod(c){ return c.type!=='cyls'; }
function cylW(c){ if(c.type==='grip') return 60; return clamp(Math.round((60+(+pget(c,'stroke'))*0.6)/10)*10,80,260); }
function cylArea(c){ var D=+pget(c,'bore'), d=+pget(c,'rod')||0; var A=Math.PI*D*D/4, Ar=Math.PI*d*d/4, An=Math.max(1,A-Ar), k=pget(c,'kind');
  if(c.type==='cylr') return {A:A,An:A};
  if(k==='through') return {A:An,An:An};
  if(k==='tandem') return {A:A+An,An:2*An};
  if(k==='rodless') return {A:A,An:A};
  return {A:A,An:An}; }
function cylDead(c){ var a=cylArea(c); return 0.0008 + 0.03*a.A*(+pget(c,'stroke'))*1e-6; }
function cylTravel(c){ var S=+pget(c,'stroke'), w=+pget(c,'stop')||0; return (w>0&&w<S)?w:S; }
function gravSign(c){ if(c.type==='cylr'||c.type==='grip') return 0; var m=pget(c,'mount'); if(m==='horizontal') return 0; if(m==='up') return -1; if(m==='down') return 1;
  var d=dirW(c,'r'); return d[1]>0?1:d[1]<0?-1:0; }
function lockMode(c){ return c.type==='cyld'?(pget(c,'lock')||'none'):'none'; }
function cylGeom(c){ var W=cylW(c), ports=[{id:'A',x:10,y:40,dir:'d',kind:'p'}];
  if(c.type==='cylr') return {ports:[{id:'A',x:10,y:60,dir:'d',kind:'p'},{id:'B',x:50,y:60,dir:'d',kind:'p'}],bounds:{x:0,y:2,w:64,h:60}};
  if(hasRod(c)) ports.push({id:'B',x:W-10,y:40,dir:'d',kind:'p'});
  if(lockMode(c)!=='none') ports.push({id:'L',x:W-20,y:-20,dir:'u',kind:'pilot'});
  if(c.type==='grip') return {ports:ports,bounds:{x:-2,y:-34,w:W+4,h:76}};
  var k=pget(c,'kind'), x0=k==='through'?-W:-2;
  return {ports:ports,bounds:{x:x0,y:-22,w:2*W+24-x0,h:66}}; }
function cylDraw(c,st,E){
  if(c.type==='cylr') return rotDraw(c,st,E);
  if(c.type==='grip') return gripDraw(c,st,E);
  var W=cylW(c), S=+pget(c,'stroke'), f=st?clamp(st.x/S,0,1):0, H=30, k=pget(c,'kind')||'standard';
  var pl=3+(W-14)*f, g='', t=[];
  var pa=E?E.pp(E.I(c,'cap')):0, pb=(E&&hasRod(c))?E.pp(E.I(c,'rod')):0;
  g+=R(1,1,pl-1,H-2,'cham',' style="fill:'+pFill(pa)+'"');
  g+=R(pl+6,1,Math.max(0,W-pl-7),H-2,'cham',' style="fill:'+pFill(pb)+'"');
  g+=R(0,0,W,H,'sym')+R(pl,1,6,H-2,'symf');
  var rh=Math.max(4,Math.min(12,(+pget(c,'rod'))/(+pget(c,'bore'))*H));
  var tipAt=function(ff){ return 3+(W-14)*ff+6+W-4; }, tip=tipAt(f);
  if(k==='rodless'){ g+=R(pl-8,-10,22,10,'box')+L(pl+3,-10,pl+3,0); tip=pl+3; }
  else { g+=R(pl+6,H/2-rh/2,tip-pl-6,rh,'box')+L(W,H/2-rh/2,W,H/2+rh/2,'sym'); }
  if(k==='through'){ var xl=pl-(W-4); g+=R(xl,H/2-rh/2,pl-xl,rh,'box')+L(0,H/2-rh/2,0,H/2+rh/2,'sym'); }
  if(k==='tandem'){ g+=L(W/2,1,W/2,H/2-rh/2-1,'sym" stroke-width="2.2')+L(W/2,H/2+rh/2+1,W/2,H-1,'sym" stroke-width="2.2'); t.push({x:W/2,y:H+12,s:'tandem',cls:'lbl',a:'middle'}); }
  if(c.type==='cyls'){ g+=zig(pl+8,W-2,H/2+rh/2+5,3.5,4); g+=L(W-10,H,W-10,H+4)+L(W-13,H+4,W-7,H+4); }
  g+=L(10,H,10,40,'pin'); if(hasRod(c)) g+=L(W-10,H,W-10,40,'pin');
  if(pget(c,'cush')==='yes'){ g+=R(2,H/2-5,6,10,'sym')+R(W-8,H/2-5,6,10,'sym')+arrow(-1,H+3,9,H-7); }
  var lm=lockMode(c);
  if(lm!=='none'){ var eng=st?st.lk:true; g+=L(W-20,-20,W-20,-10,'pin')+R(W-28,-10,16,10,'box'+(eng?' coil onn':''))+L(W-25,-5,W-15,-5);
    t.push({x:W-32,y:-12,s:lm==='lock'?'lock':'brake',cls:'pt',a:'end'}); }
  var stp=+pget(c,'stop')||0;
  if(stp>0&&stp<S&&k!=='rodless'){ var xs=tipAt(stp/S); g+=R(xs,-2,8,H+4,'box'); for(var i=0;i<4;i++) g+=L(xs,4+i*7,xs+8,-2+i*7,'sym" stroke-width="0.8'); t.push({x:xs+4,y:H+14,s:'part',cls:'lbl',a:'middle'}); }
  var m=+pget(c,'load'); if(m>0){ if(k==='rodless') t.push({x:pl+3,y:-14,s:fmt(m,m<10?1:0)+' kg',cls:'lbl',a:'middle'});
    else { var lx=stp>0&&stp<S?tip-18:tip; g+=R(lx,H/2-9,18,18,'box'); t.push({x:lx+9,y:H+14,s:fmt(m,m<10?1:0)+' kg',cls:'lbl',a:'middle'}); } }
  var tick0=k==='rodless'?6:W+5, tick1=k==='rodless'?W-8:2*W-9;
  sensorsOf(c).forEach(function(sn){ var pos=clamp(sn.pos/S,0,1), x=tick0+(tick1-tick0)*pos;
    g+=L(x,-8,x,-1,'sym" stroke-width="1'); t.push({x:x,y:-11,s:sn.tag,cls:'pt',a:'middle'}); });

  else if(rr0===270) t.push({world:true,x:36,y:-Math.round(W/2)+16,s:dim,cls:'lbl',a:'start'});
  else t.push({x:W/2,y:H+12,s:dim,cls:'lbl',a:'middle'});
  var mt=pget(c,'mount');
  var rr=((c.rot||0)%360+360)%360;  // the label is only needed when the drawing does not already show it
  if((mt==='up'||mt==='down')&&rr!==90&&rr!==270) t.push({x:W/2,y:H+22,s:mt==='up'?'vertical, rod up':'vertical, rod down',cls:'lbl',a:'middle'});
  if(st&&E){ var lab=fmt(st.x,0)+' mm'; if(st.stall) lab+=' · '+fmt(st.F,0)+' N'; t.push({x:W/2,y:-10,s:lab,cls:'val',a:'middle'}); }
  return {g:g,t:t};
}
function rotDraw(c,st,E){ var S=+pget(c,'stroke'), f=st?clamp(st.x/S,0,1):0, g='', t=[];
  // course symbol: a half-dome on its base, two pneumatic ports; the needle shows the shaft angle
  var pa=E?E.pp(E.I(c,'cap')):0, pb=E?E.pp(E.I(c,'rod')):0;
  g+='<path d="M4 40 A26 26 0 0 1 30 14 L30 40 Z" style="fill:'+pFill(pa)+';stroke:none"/><path d="M30 14 A26 26 0 0 1 56 40 L30 40 Z" style="fill:'+pFill(pb)+';stroke:none"/>';
  g+='<path d="M4 40 A26 26 0 0 1 56 40 Z" class="sym"/>'+PG([[10,40],[6,34],[14,34]],'sym')+PG([[50,40],[46,34],[54,34]],'sym');

  g+=L(10,40,10,60,'pin')+L(50,40,50,60,'pin');

  sensorsOf(c).forEach(function(sn){ var b=(-180+clamp(sn.pos/S,0,1)*180)*Math.PI/180; g+=L(30+27*Math.cos(b),40+27*Math.sin(b),30+32*Math.cos(b),40+32*Math.sin(b),'sym" stroke-width="1'); });
  return {g:g,t:t}; }
function gripDraw(c,st,E){ var S=+pget(c,'stroke'), f=st?clamp(st.x/S,0,1):0, g='', t=[], H=30;
  var pa=E?E.pp(E.I(c,'cap')):0, pb=E?E.pp(E.I(c,'rod')):0;
  g+=R(1,1,29,H-2,'cham',' style="fill:'+pFill(pa)+'"')+R(30,1,29,H-2,'cham',' style="fill:'+pFill(pb)+'"')+R(0,0,60,H,'sym')+L(30,0,30,H);
  var o=14-10*f;  // jaw opening: A closes the jaws
  g+=PL([[30-o-6,-2],[30-o-6,-30],[30-o,-30],[30-o,-14]])+PL([[30+o+6,-2],[30+o+6,-30],[30+o,-30],[30+o,-14]])+L(20,0,24,-2)+L(40,0,36,-2);

  t.push({x:4,y:H+8,s:'close',cls:'pt',a:'end'}); t.push({x:56,y:H+8,s:'open',cls:'pt',a:'start'});

var cylParams=[
  {k:'bore',label:'Bore Ø (mm)',type:'num',def:32,min:6,max:320},
  {k:'rod',label:'Rod Ø (mm)',type:'num',def:12,min:2,max:200},
  {k:'stroke',label:'Stroke (mm)',type:'num',def:100,min:5,max:1000},
  {k:'load',label:'Moving load (kg)',type:'num',def:0,min:0,max:2000,step:0.1,live:true},
  {k:'mount',label:'Mounting',type:'sel',opts:['horizontal','up','down','drawn'],names:{drawn:'as drawn on the sheet',horizontal:'horizontal',up:'vertical, rod up',down:'vertical, rod down'},def:'horizontal'},
  {k:'fric',label:'Friction (N)',type:'num',def:15,min:0,max:5000,live:true},
  {k:'stop',label:'Part / stop at (mm, 0 = none)',type:'num',def:0,min:0,max:1000,live:true},
  {k:'cush',label:'End cushioning',type:'sel',opts:['no','yes'],def:'no'},
  {k:'cushAdj',label:'Cushion opening (%)',type:'range',def:15,min:1,max:100,live:true,show:function(c){ return pget(c,'cush')==='yes'; }}
];
var cylSim={
  nodes:function(c){ var a=cylArea(c), S=+pget(c,'stroke'), d=cylDead(c); var n=[{k:'cap',V:d}]; if(hasRod(c)) n.push({k:'rod',V:d+a.An*S*1e-6}); return n; },
  init:function(c,st){ st.x=0; st.v=0; st.lk=true; st.stall=false; st.F=0; },
  links:function(c,st,E){ var Cp=c.type==='grip'?0.6:1.2, S=+pget(c,'stroke'), cl=Math.min(15,S*0.2), cu=pget(c,'cush')==='yes', k=clamp(+pget(c,'cushAdj'),1,100)/100*0.25;
    E.link(E.P(c,'A'),E.I(c,'cap'),Cp,1);
    E.link(E.I(c,'cap'),E.P(c,'A'),(cu&&st.x<cl)?Cp*k:Cp,1);
    if(hasRod(c)){ E.link(E.P(c,'B'),E.I(c,'rod'),Cp,1); E.link(E.I(c,'rod'),E.P(c,'B'),(cu&&st.x>S-cl)?Cp*k:Cp,1); } },
  step:function(c,st,dt,E){
    var a=cylArea(c), S=+pget(c,'stroke'), Smax=cylTravel(c), dead=cylDead(c);
    var pc=E.pp(E.I(c,'cap')), pr=hasRod(c)?E.pp(E.I(c,'rod')):0;
    var F=pc*0.1*a.A - pr*0.1*a.An;                    // bar*0.1 = N/mm²
    if(c.type==='cyls') F-= (+pget(c,'spring0')) + (+pget(c,'springK'))*st.x;
    var m=0.15+0.25*(+pget(c,'bore'))/32*(1+S/500)*(pget(c,'kind')==='tandem'?1.6:1)+(+pget(c,'load')||0);
    F+=gravSign(c)*m*9.81;
    var Fc=+pget(c,'fric'), cv=E.hy?1500:40, lm=lockMode(c), hold=false;
    if(lm!=='none'){ var pl=E.pp(E.P(c,'L')); if(st.lk){ if(pl>3.0) st.lk=false; } else if(pl<2.0) st.lk=true;
      if(st.lk){ var Fl=+pget(c,'lockF'); if(lm==='lock'){ if(Math.abs(F)<=Fl){ hold=true; } else Fc+=Fl; } else Fc+=Fl; } }
    var v=st.v/1000;
    if(hold){ st.v=0; }
    else if(Math.abs(v)<0.002 && Math.abs(F)<=Fc*1.15){ st.v=0; }
    else { var sg=Math.abs(v)>=0.002?Math.sign(v):Math.sign(F); F-=sg*Fc+cv*v; st.v+=F/m*1000*dt;
      if(v!==0 && Math.sign(st.v)!==Math.sign(v) && Math.abs(F)<=Fc*1.15) st.v=0; }
    st.x+=st.v*dt;
    if(st.x<=0){ st.x=0; if(st.v<0) st.v=0; } else if(st.x>=Smax){ st.x=Smax; if(st.v>0) st.v=0; }
    st.stall = Smax<S && st.x>=Smax-0.01; st.F=pc*0.1*a.A - pr*0.1*a.An;
    E.setV(E.I(c,'cap'),dead+a.A*st.x*1e-6);
    if(hasRod(c)) E.setV(E.I(c,'rod'),dead+a.An*(S-st.x)*1e-6);
  },
  signals:function(c,st,E){ var t=tagOf(c), S=+pget(c,'stroke'), out=[{k:'cyl',name:t,v:st.x/S,S:S,cid:c.id,unit:c.type==='cylr'?'°':'mm'},{k:'p',name:t+' '+(c.type==='cylr'?'A':'cap side'),v:E.pp(E.I(c,'cap')),cid:c.id,ch:'cap'}];

    // direction of the last movement (+1 out, -1 in): it says which chamber is the inlet (P1) and which the outlet (P2)

    return out; }
};

function mini32(x,y,on){ var s=R(x,y,24,22,'box')+R(x+24,y,24,22,'box');
  var bx=on?x:x+24; return s+(on?arrow(x+6,y+20,x+6,y+2)+L(x+18,y+22,x+18,y+16)+L(x+15,y+16,x+21,y+16):arrow(x+30,y+2,x+42,y+20)+L(x+30,y+22,x+30,y+16)+L(x+27,y+16,x+33,y+16))+
  (on?arrow(x+30,y+2,x+42,y+20)+L(x+30,y+22,x+30,y+16)+L(x+27,y+16,x+33,y+16):arrow(x+6,y+20,x+6,y+2)+L(x+18,y+22,x+18,y+16)+L(x+15,y+16,x+21,y+16)); }
function compound32Geom(){ return {ports:[{id:'2',x:30,y:-10,dir:'u',kind:'p'},{id:'1',x:30,y:50,dir:'d',kind:'p'},{id:'3',x:50,y:50,dir:'d',kind:'x'},{id:'12',x:-10,y:20,dir:'l',kind:'pilot'}],bounds:{x:-12,y:-12,w:96,h:64}}; }
function compound32Body(c,on){ // 3/2 NC drawn at rest under ports 1, 2, 3 with its actuated square on the left
  var g=L(30,-10,30,6,'pin')+L(30,34,30,50,'pin')+L(50,34,50,50,'pin');
  var off=on?24:0;
  g+=R(0+off,6,24,28,'box')+R(24+off,6,24,28,'box');
  if(on){ g+=arrow(30,32,30,8)+L(42+0,34,42,28)+L(39,28,45,28); }
  else { g+=arrow(30,8,46,32)+L(30,34,30,28)+L(27,28,33,28); }
  g+=zig(48+off,72,20,4,3);
  if(!isConnected(c,'3')) g+=PG([[50,50],[45,56],[55,56]],'sym');
  return g; }

    g+=throttleSym(-4,-2,5,true);

def('venturi',{name:'Venturi (vacuum ejector)',code:'V',cat:'Vacuum',params:[],
  geom:function(){ return {ports:[{id:'1',x:-10,y:20,dir:'l',kind:'p'},{id:'V',x:20,y:-10,dir:'u',kind:'p',lab:'V'},{id:'3',x:50,y:20,dir:'r',kind:'x'}],bounds:{x:-12,y:-12,w:74,h:44}}; },
  draw:function(c,st,E){ var on=E?E.pp(E.P(c,'1'))>0.5:false;
    // Philippe's document: the air goes straight through the nozzle, supply 1 on the left, exhaust 3 on the right; the vacuum V is taken at the throat, at right angles
    var g=L(-10,20,4,20,'pin')+L(20,-10,20,10,'pin')+L(36,20,50,20,'pin')+R(4,10,32,20,'box')+L(4,10,20,20)+L(4,30,20,20)+L(36,10,20,20)+L(36,30,20,20)+(on?C(20,20,2.4,'flow'):'');
    if(!isConnected(c,'3')) g+=PG([[50,20],[56,15],[56,25]],'sym');
    return {g:g,t:[{x:14,y:-3,s:'V',cls:'pt',a:'middle'},{x:-6,y:15,s:'1',cls:'pt',a:'middle'},{x:46,y:15,s:'3',cls:'pt',a:'middle'}]}; },
  sim:{links:function(c,st,E){ var f=clamp(E.pp(E.P(c,'1'))/4.5,0,1);
    // the vacuum port always communicates with the exhaust through the nozzle: without supply air, outside air comes back in and the vacuum breaks
    E.link(E.P(c,'V'),E.P(c,'3'),0.2*(1-f),0);
    if(f<=0) return;
    E.link(E.P(c,'V'),E.SRC(1-0.88*f),0.12*f,1);   // the jet draws air out of the vacuum port
    E.link(E.P(c,'1'),E.P(c,'3'),0.25,0); }}});      // and consumes supply air

    if(pget(c,'on')==='off') g+=L(-10,-10,10,10,'sym" style="stroke:var(--no)')+L(-10,10,10,-10,'sym" style="stroke:var(--no)'); return {g:g,t:[]}; },

def('cup',{name:'Suction cup',code:'Z',cat:'Vacuum',
  params:[{k:'d',label:'Cup Ø (mm)',type:'num',def:40,min:5,max:300},{k:'mass',label:'Part mass (kg)',type:'num',def:1,min:0,max:200,step:0.1,live:true},
    {k:'part',label:'Part under the cup',type:'sel',opts:['yes','no'],def:'yes',live:true},{k:'leak',label:'Leak (rough surface, %)',type:'range',def:0,min:0,max:100,live:true}],

    var g=L(20,-10,20,6,'pin')+'<g class="hot" data-c="'+c.id+'" data-act="part"><path d="M8 20 L14 6 L26 6 L32 20 Z" class="box" style="fill:'+(pv<-0.05?'var(--c3)':'var(--sheet)')+'"/>';
    if(part) g+=R(-6,(held?21:30),52,10,'box'+(held?' coil onn':''),'');
    g+=R(-10,16,60,26,'hitr')+'</g>';
    return {g:g,t:[{x:46,y:6,s:E?fmt(pv,2)+' bar g':'',cls:'val',a:'start'},{x:20,y:52,s:part?(held?'part held':(E?'part not held':'part')):'no part',cls:'lbl',a:'middle'}]}; },
  sim:{nodes:function(){ return [{k:'cup',V:0.002}]; }, init:function(c,st){ st.held=false; },
    links:function(c,st,E){ E.link(E.P(c,'1'),E.I(c,'cup'),0.6,0);

      else { var lk=clamp(+pget(c,'leak'),0,100)/100; if(lk>0) E.link(E.I(c,'cup'),E.ATM,0.3*Math.pow(lk,1.5),0); } },
    step:function(c,st,dt,E){ var pv=E.pp(E.I(c,'cup')), A=Math.PI*Math.pow(+pget(c,'d'),2)/4;
      if(pget(c,'part')!=='yes'){ st.held=false; return; }
      if(pv>0.15&&st.held){ st.held=false; }     // blow-off releases the part
      var F=Math.max(0,-pv)*0.1*A, W=(+pget(c,'mass'))*9.81*2;   // safety factor 2, as in practice
      st.held = F>=W && pv<-0.05; },
    signals:function(c,st){ return [{k:'sens',name:tagOf(c)+' held',v:st.held?1:0}]; }}});

/* ===== measuring and electrical ===== */
def('pswitch',{name:'Pressure / vacuum switch',code:'B',cat:'Measuring',

  g+= nc ? arrow(6,12,34,12)+L(0,20,4,20)+L(36,20,40,20) : arrow(4,20,36,20);   // closed: the arrow is set aside from the ports; open: it joins them
  if(op) g+=L(6,12+(nc?0:8),34,12+(nc?0:8),'sym" stroke="var(--run)" stroke-width="2.2');
  g+= pilotIn ? PL([[-4,20],[-4,-2],[10,-2],[10,4]],'sym" stroke-dasharray="3 2')+PG([[10,4],[7,0],[13,0]],'sym')
              : PL([[44,20],[44,-2],[30,-2],[30,4]],'sym" stroke-dasharray="3 2')+PG([[30,4],[27,0],[33,0]],'sym');
  g+=zigV(20,36,52,5,3)+arrow(12,54,28,38);   // adjustable spring
  if(kind!=='relief') g+=PL([[pilotIn?30:10,36],[pilotIn?30:10,44],[pilotIn?38:2,44]],'sym" stroke-dasharray="3 2');   // external drain to tank
  var lab={relief:['P','T'],red:['P','A'],seq:['P','A']}[kind];
  return {g:g,t:[{x:-6,y:15,s:lab[0],cls:'pt',a:'middle'},{x:46,y:15,s:lab[1],cls:'pt',a:'middle'},{x:6,y:50,s:fmt(+pget(c,'p'),0)+' bar',cls:'val',a:'end'}]}; }
function pValveGeom(kind){ var lab={relief:['P','T'],red:['P','A'],seq:['P','A']}[kind];
  return function(){ return {ports:[{id:lab[0],x:-10,y:20,dir:'l',kind:'p'},{id:lab[1],x:50,y:20,dir:'r',kind:'p'}],bounds:{x:-12,y:-6,w:64,h:62}}; }; }
def('hrelief',{name:'Pressure relief valve',code:'V',cat:'Pressure',
  params:[{k:'p',label:'Opening pressure (bar)',type:'num',def:50,min:1,max:300,step:1,live:true}],
  geom:pValveGeom('relief'), draw:function(c,st,E){ return pValveDraw(c,st,E,'relief'); },
  sim:{init:function(c,st){ st.o=0; },
    links:function(c,st,E){ st.o=clamp((E.pp(E.P(c,'P'))-(+pget(c,'p')))/3,0,1);   // opens above the setting, fully 3 bar higher
      if(st.o>0) E.link(E.P(c,'P'),E.P(c,'T'),8*st.o,1); }}});
def('hred',{name:'Pressure reducing valve',code:'V',cat:'Pressure',
  params:[{k:'p',label:'Reduced pressure (bar)',type:'num',def:20,min:1,max:300,step:1,live:true}],
  geom:pValveGeom('red'), draw:function(c,st,E){ return pValveDraw(c,st,E,'red'); },
  sim:{init:function(c,st){ st.o=1; },
    links:function(c,st,E){ st.o=clamp(((+pget(c,'p'))-E.pp(E.P(c,'A')))/3,0,1);   // open while the outlet is below the setting, closing as it gets there
      if(st.o>0) E.link(E.P(c,'P'),E.P(c,'A'),4*st.o,1); }}});
def('hseq',{name:'Sequence valve',code:'V',cat:'Pressure',
  params:[{k:'p',label:'Opening pressure (bar)',type:'num',def:30,min:1,max:300,step:1,live:true}],
  geom:pValveGeom('seq'), draw:function(c,st,E){ return pValveDraw(c,st,E,'seq'); },
  sim:{init:function(c,st){ st.o=0; },
    links:function(c,st,E){ st.o=clamp((E.pp(E.P(c,'P'))-(+pget(c,'p')))/3,0,1);   // opens to the next line when its inlet reaches the setting
      if(st.o>0) E.link(E.P(c,'P'),E.P(c,'A'),4*st.o,1); }}});

/* ===== hydraulic motor (two directions) ===== */
def('hmot',{name:'Hydraulic motor',code:'A',cat:'Actuators',
  params:[{k:'D',label:'Displacement (cm³/rev)',type:'num',def:8,min:0.5,max:500,step:0.5},{k:'T',label:'Load torque (N·m)',type:'num',def:2,min:0,max:500,step:0.5,live:true}],
  geom:function(){ return {ports:[{id:'A',x:-10,y:20,dir:'l',kind:'p'},{id:'B',x:50,y:20,dir:'r',kind:'p'}],bounds:{x:-12,y:-6,w:64,h:62}}; },
  draw:function(c,st){ var g=L(-10,20,4,20,'pin')+L(36,20,50,20,'pin')+C(20,20,16,'box')+PG([[4,20],[11,15],[11,25]],'symf')+PG([[36,20],[29,15],[29,25]],'symf')+L(18,36,18,48)+L(22,36,22,48);
    if(st&&Math.abs(st.w)>0.05){ var a=st.ang||0; g+=L(20,20,20+10*Math.cos(a),20+10*Math.sin(a),'sym" stroke="var(--run)" stroke-width="2'); }
    return {g:g,t:[{x:-6,y:15,s:'A',cls:'pt',a:'middle'},{x:46,y:15,s:'B',cls:'pt',a:'middle'},{x:28,y:52,s:st?fmt(st.w*60,0)+' rpm':fmt(+pget(c,'D'),1)+' cm³',cls:'val',a:'start'}]}; },
  sim:{init:function(c,st){ st.w=0; st.ang=0; },
    links:function(c,st,E){ var Q=(+pget(c,'D'))*st.w/1000; E.inflow(E.P(c,'A'),-Q); E.inflow(E.P(c,'B'),Q); },   // turning A->B swallows oil at A and gives it at B
    step:function(c,st,dt,E){ var D=+pget(c,'D'), dp=E.pp(E.P(c,'A'))-E.pp(E.P(c,'B')), Tl=+pget(c,'T'), J=0.004, cvis=0.02;
      var Td=D*dp/(20*Math.PI), om=st.w*2*Math.PI;   // N·m: D (cm³) × Δp (bar) / 20π
      if(Math.abs(om)<0.05&&Math.abs(Td)<=Tl){ om=0; }
      else { var T=Td-(Math.abs(om)>=0.05?Math.sign(om):Math.sign(Td))*Tl-cvis*om; var om2=om+T/J*dt; if(om!==0&&Math.sign(om2)!==Math.sign(om)&&Math.abs(Td)<=Tl) om2=0; om=om2; }
      st.w=om/(2*Math.PI); st.ang=(st.ang+om*dt)%(2*Math.PI); },
    signals:function(c,st,E){ return [{k:'spd',name:tagOf(c)+' speed',v:st.w*60,unit:'rpm',cid:c.id}]; }}});

/* ============ Fluid Power · project model, labels, checks ============ */
function emptyProject(tech){ return {app:'fluid-power',version:1,tech:tech==='hy'?'hy':'pn',name:'Project1',comps:[],pipes:[],seq:1,title:'',author:''}; }   // tech: 'pn' pneumatic or 'hy' hydraulic, one per project
var P=emptyProject();
var LBL={};   // computed tags: compId -> tag ; compId+':L' -> coil tag
function nid(pre){ P.seq=(P.seq||1)+1; return pre+P.seq; }
function findComp(id){ if(!id) return null; for(var i=0;i<P.comps.length;i++) if(P.comps[i].id===id) return P.comps[i]; return null; }
function tagOf(c){ if(!c) return '?'; return (c.tag&&!c.tagAuto)?c.tag:(LBL[c.id]||c.tag||''); }
function coilTag(c,sd){ var m=pget(c,'coil'+sd); return m?m:(LBL[c.id+':'+sd]||'Y'); }
function pipesAt(cid,pid){ return P.pipes.filter(function(p){ return (p.a.c===cid&&p.a.p===pid)||(p.b.c===cid&&p.b.p===pid); }); }
function isConnected(c,pid){ return pipesAt(c.id,pid).length>0; }
function sensorsOf(cyl){ var out=[];
  P.comps.forEach(function(c){
    if(c.type==='magsens' && pget(c,'cyl')===cyl.id) out.push({pos:+pget(c,'pos'),tag:tagOf(c)});
    if(VCFG[c.type]) ['L','R'].forEach(function(sd){ if(pget(c,'a'+sd)==='roller'&&pget(c,'cyl'+sd)===cyl.id) out.push({pos:+pget(c,'pos'+sd),tag:tagOf(c)}); });
  }); return out; }
function isCyl(c){ return c.type==='cyls'||c.type==='cyld'||c.type==='cylr'||c.type==='grip'; }

/* ---------- nets (for labels, checks, engine) ---------- */
function buildNets(){
  var par={};
  function key(e){ return e.c+':'+e.p; }
  function find(k){ while(par[k]!==k){ par[k]=par[par[k]]; k=par[k]; } return k; }
  function uni(a,b){ a=find(a); b=find(b); if(a!==b) par[a]=b; }
  P.comps.forEach(function(c){ geom(c).ports.forEach(function(pt){ var k=c.id+':'+pt.id; par[k]=k; }); });
  P.pipes.forEach(function(p){ var a=key(p.a), b=key(p.b); if(par[a]!==undefined&&par[b]!==undefined) uni(a,b); });
  var nets={}, of={};
  Object.keys(par).forEach(function(k){ var r=find(k); (nets[r]=nets[r]||[]).push(k); of[k]=r; });
  return {nets:nets,of:of};
}

/* ---------- automatic tags (convention kept in one place: TAGRULE) ----------
   Following Philippe's ISO 1219 sheet: circuit number + code letter + item number.
   V valves (power valve first: V1), s detectors, lowercase as on the sheet (limit valves, magnetic sensors, pressure switches),
   P pump or compressor, A cylinder, M motor, Z other devices (supply group is circuit 0).
   A coil is named after its valve and pilot side: 1YV1-14 = electro-pilot of 1V1 on side 14. */
var NETS=null;
function feedsCylinder(c){ var n=NETS||buildNets(), r=n.of[c.id+':2']; if(!r) return false; return n.nets[r].some(function(k){ var cc=findComp(k.split(':')[0]); return cc&&isCyl(cc); }); }
var VPORTS={v53:5,v52:5,v42:4,v32:3,v22:2,hv43:4,hv42:4,hv22:2};
var TAGRULE={codeOf:function(c){ var t=c.type;
    if(isCyl(c)||t==='hmot') return 'A'; if(t==='amot') return 'M'; if(t==='comp'||t==='vpump'||t==='hsrc'||t==='hpump') return 'P'; if(t==='htank') return 'Z';
    if(t==='src'||t==='silencer'||t==='plug'||t==='gauge'||t==='tank'||t==='manifold'||t==='frl'||t==='filter'||t==='lubr'||t==='flowm'||t==='cup') return 'Z';
    if(t==='magsens'||t==='pswitch') return 's';
    if(VCFG[t]&&(pget(c,'aL')==='roller'||pget(c,'aR')==='roller')) return 's';
    if(t==='v32'&&/^(button|lever|pedal)$/.test(pget(c,'aL')+'')&&!feedsCylinder(c)) return 's';
    if(VCFG[t]||/^(or|and|ofc|thr|qev|reg|softst|relief|check|pcheck|dpcheck|tdel|seqv|venturi|blocker|hrelief|hred|hseq)$/.test(t)) return 'V'; return ''; },
  // rank inside a circuit: the power valve (directional valve with the most ports) comes first
  rank:function(c){ if(TAGRULE.codeOf(c)==='V'&&VPORTS[c.type]) return -VPORTS[c.type]; return 0; },
  coilName:function(valveTag,pilot){ var m=/^(\d+)V(\d*)$/.exec(valveTag||''); return m? m[1]+'YV'+m[2]+'-'+pilot : (valveTag||'?')+'-YV'+pilot; }};
function computeLabels(){
  LBL={};
  var nets=buildNets(), circ={}, dist={}; NETS=nets;
  var adj={};
  var SUPPLY_T=/^(src|comp|tank|frl|manifold|softst|relief|vpump|filter|lubr|hsrc|hpump|htank)$/;
  // a supply line joins every circuit: it does not carry the circuit number (its accessories belong to circuit 0)
  Object.keys(nets.nets).forEach(function(r){ var ids={}; nets.nets[r].forEach(function(k){ ids[k.split(':')[0]]=1; });
    if(Object.keys(ids).some(function(id){ var c=findComp(id); return c&&SUPPLY_T.test(c.type); })) return;
    var arr=Object.keys(ids); arr.forEach(function(a){ adj[a]=adj[a]||{}; arr.forEach(function(b){ if(a!==b) adj[a][b]=1; }); }); });
  var cyls=P.comps.filter(function(c){ return isCyl(c)||c.type==='amot'||c.type==='cup'||c.type==='hmot'; }).sort(function(a,b){ return a.x-b.x||a.y-b.y; });
  cyls.forEach(function(cy,i){ var n=i+1; circ[cy.id]=n; dist[cy.id]=0;
    var q=[cy.id], seen={}; seen[cy.id]=1;
    while(q.length){ var id=q.shift(); var nb=adj[id]?Object.keys(adj[id]):[];
      nb.forEach(function(o){ if(seen[o]) return; var oc=findComp(o); if(!oc) return; seen[o]=1;
        if(isCyl(oc)||oc.type==='amot'||oc.type==='hmot'||SUPPLY_T.test(oc.type)) return;
        if(circ[o]===undefined||dist[o]>dist[id]+1){ circ[o]=n; dist[o]=dist[id]+1; }
        q.push(o); }); }
  });
  P.comps.forEach(function(c){ if(circ[c.id]===undefined){
    if(c.type==='magsens'){ var cc=findComp(pget(c,'cyl')); circ[c.id]=cc&&circ[cc.id]!==undefined?circ[cc.id]:0; }
    else if(VCFG[c.type]){ var r=pget(c,'cylL')||pget(c,'cylR'); var rc=findComp(r); circ[c.id]=(rc&&circ[rc.id]!==undefined&&(pget(c,'aL')==='roller'||pget(c,'aR')==='roller'))?circ[rc.id]:0; }
    else circ[c.id]=0; dist[c.id]=dist[c.id]||99; } });
  var order=P.comps.slice().sort(function(a,b){ return (circ[a.id]-circ[b.id])||(TAGRULE.rank(a)-TAGRULE.rank(b))||((dist[a.id]||0)-(dist[b.id]||0))||(a.x-b.x)||(a.y-b.y); });
  var count={}, used={}; P.comps.forEach(function(c){ if(!c.tagAuto&&c.tag) used[c.tag]=1; });
  order.forEach(function(c){ var code=TAGRULE.codeOf(c); if(!code) return; if(!c.tagAuto&&c.tag) return; var k=circ[c.id]+code, t;
    do { count[k]=(count[k]||0)+1; t=circ[c.id]+code+count[k]; } while(used[t]); used[t]=1; LBL[c.id]=t; });
  // coils: named after the valve and the pilot port number of their side
  P.comps.forEach(function(c){ if(!VCFG[c.type]) return; var pil=VCFG[c.type].pil(c);
    ['L','R'].forEach(function(sd){ if(pget(c,'a'+sd)!=='solenoid') return; LBL[c.id+':'+sd]=TAGRULE.coilName(tagOf(c),pil[sd]); }); });
}

/* ---------- checks ---------- */
function runChecks(){
  var out=[], nets=buildNets(), tags={};
  if(P.tech==='hy'){ var pumps=P.comps.some(function(c){ return c.type==='hsrc'||c.type==='hpump'; });
    if(!pumps&&P.comps.some(function(c){ return isCyl(c)||c.type==='hmot'; })) out.push({lvl:'w',msg:'No power unit or pump: nothing can move.'});
    if(pumps&&!P.comps.some(function(c){ return c.type==='hrelief'; })) out.push({lvl:'e',msg:'No pressure relief valve: when the flow is blocked, the pressure rises without limit (the simulation stalls the pump at '+PUMP_MAX+' bar; a real circuit would burst).'}); }
  else if(!P.comps.some(function(c){ return c.type==='src'||c.type==='comp'; })&&P.comps.some(function(c){ return isCyl(c)||c.type==='amot'; })) out.push({lvl:'w',msg:'No air supply (supply or compressor): nothing can move.'});
  P.comps.forEach(function(c){ var d=DEF[c.type], t=tagOf(c);
    if(t){ if(tags[t]) out.push({lvl:'e',c:c.id,msg:'Tag '+t+' is used twice.'}); tags[t]=1; }
    geom(c).ports.forEach(function(pt){
      if(isConnected(c,pt.id)) return;
      if(pt.kind==='p'&&c.type==='manifold'&&pt.id!=='1'){ out.push({lvl:'w',c:c.id,msg:'Outlet '+pt.lab+' of manifold '+(t||'')+' is open: air escapes. Plug it (inspector, one click) or connect it.'}); return; }
      if(pt.kind==='p'&&(VCFG[c.type]||/^(ofc|thr|or|and|qev|src|filter|lubr|reg|frl|softst|tank|check|pcheck|hrelief|hred|hseq|hmot)$/.test(c.type)))
        out.push({lvl:'w',c:c.id,msg:'Port '+(pt.lab||pt.id)+' of '+(t||d.name)+' is open: '+(P.tech==='hy'?'oil spills':'air escapes')+' there. Connect it or put a plug.'});
      if(pt.kind==='p'&&hasRod(c)&&isCyl(c)) out.push({lvl:'w',c:c.id,msg:'Port '+pt.id+' of cylinder '+t+' is not connected (it breathes to the atmosphere).'});
      if(pt.kind==='pilot'&&isCyl(c)) out.push({lvl:'w',c:c.id,msg:'Port L of the rod lock of '+t+' is not connected: the lock stays engaged.'});
      else if(pt.kind==='pilot') out.push({lvl:'w',c:c.id,msg:'Pilot port '+pt.id+' of '+t+' is not connected: this side can never switch.'});
    });
    if(VCFG[c.type]) ['L','R'].forEach(function(sd){ if(pget(c,'a'+sd)!=='roller') return; var cy=findComp(pget(c,'cyl'+sd));
      if(!cy||!isCyl(cy)) out.push({lvl:'e',c:c.id,msg:'Roller of '+t+' is not linked to a cylinder (inspector).'});
      else if(+pget(c,'pos'+sd)>+pget(cy,'stroke')) out.push({lvl:'w',c:c.id,msg:'Roller of '+t+' is beyond the stroke of '+tagOf(cy)+'.'}); });
    if(c.type==='magsens'){ var cy=findComp(pget(c,'cyl')); if(!cy||!isCyl(cy)) out.push({lvl:'e',c:c.id,msg:'Sensor '+t+' is not linked to a cylinder (inspector).'});
      else if(+pget(c,'pos')>+pget(cy,'stroke')) out.push({lvl:'w',c:c.id,msg:'Sensor '+t+' is beyond the stroke of '+tagOf(cy)+'.'}); }
    if((c.type==='cyls'||c.type==='cyld')&&pget(c,'mount')==='horizontal'&&+pget(c,'load')>0&&dirW(c,'r')[1]!==0) out.push({lvl:'w',c:c.id,msg:'Cylinder '+t+' is drawn vertical but mounted horizontal: its load does not act. Set Mounting in the inspector (or press R to turn it again).'});
    if(c.type==='v32'&&pget(c,'normal')!=='NO'&&(pget(c,'aL')==='estop'||pget(c,'aR')==='estop')) out.push({lvl:'w',c:c.id,msg:t+' has an emergency stop on a normally closed valve: air passes only while the stop is pressed. Set At rest to "normally open".'});
    if(isCyl(c)&&+pget(c,'rod')>=+pget(c,'bore')) out.push({lvl:'e',c:c.id,msg:'Cylinder '+t+': the rod must be thinner than the bore.'});
    if(VCFG[c.type]&&VCFG[c.type].n===2&&pget(c,'aL')==='spring'&&pget(c,'aR')==='spring') out.push({lvl:'w',c:c.id,msg:t+' has a spring on both sides: nothing can switch it.'});
  });
  // a net that joins a supply directly to an exhaust-type port
  Object.keys(nets.nets).forEach(function(r){ var ks=nets.nets[r]; if(ks.length<2) return;
    var hasSrc=ks.some(function(k){ var c=findComp(k.split(':')[0]); return c&&c.type==='src'; });
    var hasEx=ks.some(function(k){ var a=k.split(':'), c=findComp(a[0]); return c&&(c.type==='silencer'); });
    if(hasSrc&&hasEx) out.push({lvl:'e',msg:'The supply is piped straight into a silencer: air escapes permanently.'}); });
  return out;
}

/* ============ Fluid Power · simulation engine ============
   Lumped model: every set of joined ports is one air volume (a node); cylinder chambers are nodes too.
   Valves, throttles and ports are passages between nodes, with a flow given by the ISO 6358 formula.
   Air is isothermal: absolute pressure = amount of air (normal litres) / volume (litres). */
var DT=0.0002;          // s, integration step
function pipeVol(p){ var L=+p.len>0?+p.len:0.5, d=+p.d>0?+p.d:(P&&P.tech==='hy'?8:4); return Math.PI*d*d/4*L*1e-3; }  // litres: length in m, bore in mm (default 4 mm air, 8 mm oil)
/* Hydraulics use the same volumes and passages with oil: a volume holds an amount n = p_abs·V/β (β effective bulk modulus,

/* ============ Fluid Power · PDF (jsPDF) ============ */
function partsList(){
  var rows=[];
  P.comps.forEach(function(c){ if(c.type==='junction'||c.type==='text') return; var d=DEF[c.type], s='';
    if(VCFG[c.type]){ s=['L','R'].map(function(sd){ var a=pget(c,'a'+sd), t=ACTNAME[a]||a;
        if(a==='roller'){ var cy=findComp(pget(c,'cyl'+sd)); t+=' ('+(cy?tagOf(cy):'?')+' at '+fmt(+pget(c,'pos'+sd),0)+' mm)'; }
        if(a==='solenoid') t+=' '+coilTag(c,sd); return t; }).join(' / ');
      if(c.type==='v32') s=(pget(c,'normal')==='NO'?'normally open · ':'normally closed · ')+s;
      if(c.type==='v53') s=pget(c,'center')+' centre · '+s; }
    else if(isCyl(c)) s='Ø'+pget(c,'bore')+'/'+pget(c,'rod')+' × '+pget(c,'stroke')+' mm'+(+pget(c,'load')>0?' · load '+pget(c,'load')+' kg':'')+(pget(c,'mount')==='up'?' · vertical, rod up':pget(c,'mount')==='down'?' · vertical, rod down':'')+(pget(c,'cush')==='yes'?' · cushioning':'');
    else if(c.type==='src') s=pget(c,'p')+' bar';
    else if(c.type==='ofc'||c.type==='thr') s='opening '+fmt(+pget(c,'open'),0)+' %';
    else if(c.type==='magsens'){ var cy=findComp(pget(c,'cyl')); s='on '+(cy?tagOf(cy):'?')+' at '+fmt(+pget(c,'pos'),0)+' mm'; }
    else if(c.type==='gauge') s='0 to '+pget(c,'max')+' bar';
    rows.push([tagOf(c)||'—',d.name,s]); });
  rows.sort(function(a,b){ return String(a[0]).localeCompare(String(b[0]),'en',{numeric:true}); });
  return rows; }
function pdfText(s){ return String(s).replace(/[−–]/g,'-').replace(/[·]/g,'-').replace(/[×]/g,'x').replace(/Ø/g,'O').replace(/[^\x20-\x7E -ÿ]/g,'?'); }
$('bPdf').onclick=function(){
  dialog('<h2>PDF</h2><div class="row" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><label>Paper <select id="pdfPaper"><option value="a4">A4 landscape</option><option value="a3">A3 landscape</option></select></label></div>'+
    '<p><label><input id="pdfParts" type="checkbox" checked> Parts list</label><br><label><input id="pdfPhase" type="checkbox"'+(E&&E.hist.length?' checked':' disabled')+'> Curves'+(E&&E.hist.length?'':' (run the simulation first)')+'</label></p>'+
    '<p class="small">The title block uses the drawing title and the author typed in the inspector (click on an empty part of the sheet).</p>',
    [{t:'Make the PDF',on:true,f:function(){ var o={paper:$('pdfPaper').value,parts:$('pdfParts').checked,phase:$('pdfPhase').checked}; closeDialog(); makePDF(o); }},{t:'Cancel',f:closeDialog}]);
};
function makePDF(o){
  if(!window.jspdf){ status('PDF is not available in this browser.',true); return; }
  status('Making the PDF…');
  svgToPng(3,function(cv,ex){
    try{
    var doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:o.paper}), W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=10;
    var date=new Date(), ds=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
    var title=P.title||P.name;
    // page 1: frame, schematic, title block
    doc.setDrawColor(23,35,43); doc.setLineWidth(0.4); doc.rect(M,M,W-2*M,H-2*M-8);
    var tbW=120, tbH=24, tbX=W-M-tbW, tbY=H-M-8-tbH;
    var areaW=W-2*M-8, areaH=H-2*M-8-tbH-8;
    var sc=Math.min(areaW/ex.w,areaH/ex.h), iw=ex.w*sc, ih=ex.h*sc;
    doc.addImage(cv.toDataURL('image/png'),'PNG',M+4+(areaW-iw)/2,M+4+(areaH-ih)/2,iw,ih,undefined,'FAST');
    doc.setLineWidth(0.3); doc.rect(tbX,tbY,tbW,tbH); doc.line(tbX,tbY+10,tbX+tbW,tbY+10); doc.line(tbX+70,tbY+10,tbX+70,tbY+tbH);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(pdfText(title).slice(0,60),tbX+3,tbY+7);
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.text('Project: '+pdfText(P.name).slice(0,40),tbX+3,tbY+15); doc.text('Author: '+pdfText(P.author||'-').slice(0,40),tbX+3,tbY+20.5);
    doc.text('Date: '+ds,tbX+73,tbY+15); doc.text('Pneumatic circuit',tbX+73,tbY+20.5);
    if(o.parts){ doc.addPage(); var rows=partsList(), y=M+10;
      doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('Parts list · '+pdfText(title).slice(0,70),M,y); y+=8;
      doc.setFontSize(9); doc.text('Tag',M,y); doc.text('Component',M+22,y); doc.text('Settings',M+95,y); y+=2; doc.line(M,y,W-M,y); y+=5; doc.setFont('helvetica','normal');
      rows.forEach(function(r){ var lines=doc.splitTextToSize(pdfText(r[2]),W-2*M-95); if(y+lines.length*4.2>H-M-12){ doc.addPage(); y=M+10; }
        doc.setFont('courier','bold'); doc.text(pdfText(r[0]),M,y); doc.setFont('helvetica','normal'); doc.text(pdfText(r[1]),M+22,y); doc.text(lines,M+95,y); y+=Math.max(1,lines.length)*4.2+1.5; }); }
    if(o.phase&&E&&E.hist.length){ doc.addPage(); doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('Curves · '+pdfText(title).slice(0,60),M,M+10);
      var pc=document.createElement('canvas'), Hc=drawCurves(pc,1500,0,themeColors(true),2);
      var img=pc.toDataURL('image/png'), r=Hc/1500, w=W-2*M, h=Math.min(w*r,H-2*M-30); doc.addImage(img,'PNG',M,M+16,h/r,h,undefined,'FAST');
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text('Simulated: '+fmt(E.t,1)+' s. Simplified physics: speeds and times show the order of magnitude, not a sizing calculation.',M,H-M-12); }
    var n=doc.getNumberOfPages();
    for(var i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(93,108,118);
      doc.text(pdfText('Fluid Power v'+VERSION+' · '+P.name+' · '+ds),M,H-M+1); doc.text('© 2026 Philippe RAYMOND · CC BY-NC-ND 4.0',W/2,H-M+1,{align:'center'});
      doc.text('phil-legacy.github.io/toolbox   '+i+'/'+n,W-M,H-M+1,{align:'right'}); doc.setTextColor(0,0,0); }
    saveFile(stamp()+'.pdf',doc.output('blob'));
    }catch(e){ status('The PDF could not be made: '+esc(e.message),true); console.error(e); }
  });
}

(function init(){
  renderLibrary();
  ['bRun','bStep','bReset','speed'].forEach(function(id){ $(id).disabled=true; });
  var saved=null; try{ saved=localStorage.getItem(AUTOKEY); }catch(e){}
  var ok=false;
  if(saved){ try{ var chk=checkProject(JSON.parse(saved)); if(chk.ok){ P=chk.p; computeLabels(); runChecks(); $('pname').value=P.name; ok=true; status('Your last work is back. Examples ▾ opens ready-made circuits.'); } }catch(e){ P=emptyProject(); } }
  if(!ok){ status('Empty sheet. Pick a component in the library, or open a ready-made circuit with <b>Examples ▾</b>.'); }
  computeLabels(); render(); renderInspector(); renderChecks(); renderPhase();
  setTimeout(zoomFit,0);
  window.FluidPower={P:function(){ return P; },E:function(){ return E; },setMode:setMode,EXAMPLES:EXAMPLES,openExample:openExample,checkProject:checkProject,buildExample:buildExample,
    run:function(sec){ if(!E) setMode('sim'); RUN=false; updateRunBtn(); var n=Math.round(sec/0.02); for(var i=0;i<n;i++) E.advance(0.02); render(); renderPhase(); return E.t; },
    setCoil:function(key,on){ if(E) E.ext.coils[key]=!!on; }, press:function(key,on){ if(E){ if(on) E.ui.held[key]=true; else delete E.ui.held[key]; } },
    latch:function(key,on){ if(E){ E.ui.latch[key]=!!on; } }, version:VERSION};
})();
