<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Cyber Workshop</title>
<meta name="description" content="Industrial cybersecurity, hands-on: find the flaws of a workshop, play attack scenarios against your defences and handle an incident, on a machine that is standalone, connected to the plant network or open to remote maintenance.">
<style>
:root{--bg:#e6edf2;--panel:#ffffff;--ink:#0f1d26;--muted:#475763;--line:#b4c1cb;--accent:#0a6687;--run:#c26f00;--run-ink:#8f5200;--badge-bg:#8f5200;--badge-fg:#ffffff;--yes:#17733f;--no:#b32d22;
 --sheet:#ffffff;--zone:#f3f6f8;--soft:#dde5eb;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
 color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
button,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;min-height:30px}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button.run{border-color:var(--run);color:var(--run-ink)}
button:disabled{opacity:.45;cursor:default}
select{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-height:30px;max-width:100%}
header.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-top:4px solid var(--accent);border-bottom:1px solid var(--line)}
header.top h1{margin:0;font:600 17px var(--mono);border:1.5px solid var(--ink);border-radius:3px;padding:2px 10px;white-space:nowrap}
header.top h1 span{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.spacer{flex:1}
.lbl{font-size:12px;color:var(--muted)}
#stageBar{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
#stageBar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#stageDesc{font-size:13px;color:var(--ink);flex:1 1 100%}
#main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:10px;padding:10px;align-items:start}
#view{background:var(--sheet);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
#safMenu{position:absolute;z-index:20;width:270px;background:var(--panel);border:1.5px solid var(--accent);border-radius:8px;box-shadow:0 6px 22px rgba(15,29,38,.22);padding:8px 10px 10px}
#safMenu[hidden]{display:none}
#safMenu .hd{display:flex;align-items:flex-start;gap:6px;font-weight:600;font-size:13px;margin-bottom:6px}#safMenu .hd span{flex:1}
#safMenu .x{min-height:24px;padding:0 7px}
#safMenu .o{display:block;width:100%;text-align:left;margin:4px 0;padding:6px 8px;font-size:13px}
#safMenu .o small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
#safMenu .o.on{background:color-mix(in srgb,var(--accent) 12%,var(--panel));color:var(--ink);border-color:var(--accent);border-width:2px}
#safMenu .o.on small{color:var(--ink)}
.dev .pill rect{fill:var(--accent)}.dev .pill text{fill:#fff;font:700 10px var(--sans)}
.dev .stbar.green{fill:var(--yes)}.dev .stbar.orange{fill:var(--run)}.dev .stbar.red{fill:var(--no)}.dev .stbar.grey{fill:#a9b4bc}
#prot{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13px;background:var(--panel);position:sticky;left:0}
#prot .k{font-weight:700}#prot .n{font-weight:700;font-variant-numeric:tabular-nums}
#prot .lg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}#prot .lg i{display:inline-block;width:16px;height:5px;border-radius:2px;vertical-align:2px;margin-right:4px}
.phase{display:flex;gap:4px;list-style:none;padding:0;margin:8px 0 10px}
.phase li{flex:1;font-size:11.5px;line-height:1.25;padding:5px 6px;border-radius:4px;background:var(--soft);color:var(--muted)}
.phase li.cur{background:var(--accent);color:#fff;font-weight:600}.phase li.done{background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--ink)}
#log li.past{font-size:12px}#log li.now{font-size:14.5px;border-left-width:5px;padding:8px 10px}
.res{border:2px solid var(--line);border-radius:6px;padding:8px 10px;margin:8px 0;background:var(--sheet)}
.res.okc{border-color:var(--yes)}.res.koc{border-color:var(--no)}.res.wac{border-color:var(--run)}
.res .rh{font-weight:700;font-size:14.5px;margin-bottom:4px}.res table{border-collapse:collapse;font-size:13px;width:100%}.res td{padding:2px 4px;vertical-align:top}.res td:first-child{color:var(--muted);white-space:nowrap;width:1%}
.btns .big{font-weight:600}
.defbox{border:2px solid var(--accent);border-radius:6px;padding:7px 10px;margin:8px 0;background:var(--sheet)}
.defbox ul{list-style:none;padding:0;margin:4px 0}.defbox li{margin:3px 0;font-size:13px}
@media (max-width:760px){#safMenu{position:fixed;left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto;max-height:80vh;overflow:auto}}
#view svg{display:block;width:100%;height:auto;touch-action:manipulation}
#side{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
#side h2{font-size:15px;margin:0 0 6px}
#side h3{font-size:13px;margin:12px 0 4px}
.small{font-size:12px;color:var(--muted)}
.prog{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:4px 0 8px}
.prog i{display:block;height:100%;background:var(--yes);width:0}
.item{border:1px solid var(--line);border-radius:5px;padding:7px 8px;margin:6px 0;background:var(--sheet)}
.item .q{display:flex;gap:6px;align-items:flex-start}
.item .q span{flex:1}
.item .ans{margin-top:6px;font-size:13px}
.item.good{border-color:var(--yes)}
.item.bad{border-color:var(--no)}
.tag{display:inline-block;font:600 11px var(--mono);padding:0 5px;border-radius:3px;border:1px solid currentColor;margin-right:4px;vertical-align:1px}
.ok{color:var(--yes)}.ko{color:var(--no)}.wa{color:var(--run-ink)}
.meas{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.meas:last-child{border-bottom:0}
.meas input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.meas b{font-weight:600}
.meas .c{font-size:12px;color:var(--run-ink)}
.meas .r{font-size:11px;color:var(--muted);font-family:var(--mono)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 8px}.chip{font-size:12px;min-height:28px;padding:2px 8px;border-radius:14px}.chip.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}.chip .cnt{display:inline-block;min-width:16px;border-radius:8px;background:var(--badge-bg);color:var(--badge-fg);font-weight:700;font-size:11px;text-align:center}
#log{list-style:none;padding:0;margin:6px 0}
#log li{border-left:3px solid var(--line);padding:4px 8px;margin:4px 0;background:var(--sheet);font-size:13px}
#log li.r{border-color:var(--no)}#log li.g{border-color:var(--yes)}#log li.o{border-color:var(--run)}#log li.i{border-color:var(--accent)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:7px 10px}
.opt.right{border-color:var(--yes);background:color-mix(in srgb,var(--yes) 14%,var(--panel))}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--panel))}
.fb{font-size:13px;border-radius:5px;padding:7px 9px;margin:6px 0;background:var(--sheet);border:1px solid var(--line)}
a{color:var(--accent)}
button.lnk{border:0;background:none;padding:0;min-height:0;color:var(--accent);text-decoration:underline;font-weight:600}
details{margin:6px 0}
summary{cursor:pointer;color:var(--accent)}
/* svg */
.zone rect{fill:var(--zone);stroke:var(--line);stroke-width:1.5}
.zone text{fill:var(--muted);font:700 11.5px var(--sans)}
.zone.zi rect{fill:#f1eefb;stroke:#a99dd6}.zone.zi text{fill:#4f3f8c}
.zone.zo rect{fill:#e8f2fb;stroke:#8fb6da}.zone.zo text{fill:#235a85}
.zone.zs rect{fill:#e7f5ef;stroke:#86c4aa}.zone.zs text{fill:#1f6449}
.zone.zc rect{fill:#fdf3e3;stroke:#dcb676}.zone.zc text{fill:#7d500c}
.zone.zm rect{fill:#f2f4f6;stroke:#bcc5cc}.zone.zm text{fill:#46535c}
.zone.off rect{fill:#f4f6f8;stroke:#ccd5db;stroke-dasharray:5 4}.zone.off text{fill:#7d8b95;font-weight:600}.zone.off{opacity:.6}
.wire{stroke:#5a6a75;stroke-width:2;fill:none}
.wire.radio{stroke:var(--accent);stroke-dasharray:2 5;stroke-width:2.5;stroke-linecap:round}
.wire.occ{stroke-dasharray:6 5}
.wire.hw{stroke:var(--run);stroke-dasharray:3 3}
.dev{cursor:pointer}
.dev rect.b{fill:var(--panel);stroke:#33434d;stroke-width:1.4}
.dev text.g{font:700 12px var(--mono);fill:var(--accent)}
.dev text.l{font:12px var(--sans);fill:var(--ink)}
.dev text.s{font:10.5px var(--sans);fill:var(--muted)}
.dev.off{opacity:.3;pointer-events:none}
.dev.sel rect.b{stroke:var(--accent);stroke-width:3}
.dev.pwn rect.b{stroke:var(--no);stroke-width:3;fill:color-mix(in srgb,var(--no) 16%,var(--panel))}
.dev.hit rect.b{stroke:var(--run);stroke-width:3}
.dev:focus{outline:none}.dev:focus-visible rect.b{stroke:var(--accent);stroke-width:3}
.badge circle{fill:var(--badge-bg)}.badge text{fill:var(--badge-fg);font:700 11px var(--sans)}
.badge.done circle{fill:var(--yes)}
.fw rect{fill:var(--yes)}.fw text{fill:#fff;font:700 10px var(--mono)}
.nofw rect{fill:#fff;stroke:var(--no);stroke-width:1.5}.nofw text{fill:var(--no);font:700 10.5px var(--sans)}
.atk{stroke:var(--no);stroke-width:3.5;fill:none;stroke-dasharray:9 6;animation:dash .8s linear infinite}
@media (prefers-reduced-motion: reduce){.atk{animation:none}}
@keyframes dash{to{stroke-dashoffset:-30}}
.shield path{fill:var(--yes)}.shield text{fill:#fff;font:700 13px var(--sans)}
.mach .belt{fill:var(--soft);stroke:var(--ink)}
.mach .roll{fill:var(--panel);stroke:var(--ink)}
.mach .box{fill:#c9a36b;stroke:#7a5a2b}
.mach .frame{fill:none;stroke:var(--ink);stroke-width:2}
.mach .ram{fill:var(--muted);stroke:var(--ink)}
.mach .mark.ok{fill:var(--ink)}.mach .mark.bad{fill:var(--no)}
.mach .door{fill:color-mix(in srgb,var(--accent) 20%,transparent);stroke:var(--accent);stroke-width:2}
.mach .man{stroke:var(--no);stroke-width:3;fill:none}
.mach .st{font:700 13px var(--sans)}
.mach .lamp{stroke:var(--ink)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-start;justify-content:center;padding:24px 10px;z-index:90;overflow:auto}
#modal.open{display:flex}
#modalBox{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:760px;width:100%;padding:16px 18px;position:relative}
#modalBox h2{margin:0 0 8px;font-size:18px}
#modalBox h3{margin:14px 0 4px;font-size:14px}
#modalBox p,#modalBox li{font-size:13.5px}
#modalBox table{border-collapse:collapse;width:100%;font-size:12.5px}
#modalBox td,#modalBox th{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
#mClose{position:absolute;top:10px;right:10px}
.warn{border-left:3px solid var(--run);padding:4px 10px;background:var(--sheet)}
@media (max-width:900px){#main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){#view{overflow-x:auto;-webkit-overflow-scrolling:touch}#view svg{width:760px;max-width:none}#view::after{content:attr(data-swipe);display:block;font-size:11px;color:var(--muted);padding:2px 8px;position:sticky;left:0}}
@media (max-width:520px){header.top h1 span{display:none}#main{padding:6px;gap:6px}#stageBar{padding:6px}}

:root{--bg:#efeee9;--ink:#172d36;--line:#cdd3ce;--accent:#1854bb;--sheet:#fffefa;--zone:#f0f2ed;--badge-bg:#42565b;--soft:#e3e8e3}
body{font-size:15px}
header.top{background:#162f37;border:0;padding:12px clamp(12px,2vw,34px);gap:12px;color:white}
header.top h1{border:0;padding:0;margin-right:12px;font:700 23px/1.2 var(--sans);letter-spacing:-1px}
header.top h1 span{display:none}
header.top button{background:transparent;color:#dce8e6;border-color:#547075}
#modes{border:0;gap:4px;flex-wrap:wrap}
#modes button{border:0;border-bottom:3px solid transparent;border-radius:0;padding:9px 8px;font-weight:550}
#modes button.on{background:transparent;color:white;border-bottom-color:#8bc9ff}
#stageBar{padding:12px clamp(12px,2vw,34px);background:#fafaf5}
#main{padding:clamp(8px,1.5vw,26px);gap:16px}
#view,#side{border-radius:12px;box-shadow:0 4px 16px #18372f0b}
#side{padding:18px}
#side h2{font:700 24px/1.15 var(--sans);letter-spacing:-.7px}
#side h3{font-size:19px}
.item{padding:12px;border-radius:8px}
.item button{min-height:36px;padding-inline:14px}
#prot{padding:10px 14px}
.dev .b{fill:#fffefa;stroke:#839790}
.dev.sel .b{stroke:#1854bb;stroke-width:3px}
.dev .l{font-family:var(--sans);font-weight:700}
.wire.chosen{stroke:#1854bb;stroke-width:3}
#view .zone.off{opacity:.42}
#side details{margin:10px 0;color:var(--muted);font-size:13px}
#side summary{cursor:pointer}
@media(min-width:901px){#main{grid-template-columns:minmax(0,1fr) clamp(340px,30vw,470px)}}
@media(max-width:760px){header.top{gap:6px}#modes{order:4;width:100%}#modes button{flex:1;font-size:12px;padding:6px 2px}#side{padding:14px}}
#view .zone.zc rect{fill:#e2efec;stroke:#a4bfba}
#view .zone.zm rect{fill:#e9e9df;stroke:#c2c2b3}
#view .zone.zs rect{fill:#edf0f5}
#view .zone.off rect{fill:#f4f4ef;stroke-dasharray:4 5}
#view .zone text{font-size:12px;letter-spacing:.3px}
#side .item{border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 0 14px 10px;margin:0;border-left:4px solid transparent}
#side .item.good{border-left-color:var(--yes)}#side .item.bad{border-left-color:var(--no)}
#side .item .q{font-weight:550;font-size:16px}
#side .impact{border-left:3px solid #367c77;background:#edf5f0;padding:9px 12px;margin:8px 0}
.impact b,.impact small{display:block}.impact small{color:#405456;margin-top:4px}
#side .prog i{background:#3b7878}
#side .progressLabel{display:flex;justify-content:space-between;color:#44585e;font-size:13px}
</style>
</head>
<body>
<header class="top">
 <h1>Cyber Workshop <span>v1.0 beta</span></h1>
 <div class="seg" id="modes" role="group" aria-label="Mode">
  <button data-m="hunt" class="on" aria-pressed="true">1 · Hunt the flaws</button>
  <button data-m="attack" aria-pressed="false">2 · Attacks</button>
  <button data-m="incident" aria-pressed="false">3 · Incident drill</button>
  <button data-m="reg" aria-pressed="false">4 · Regulation</button>
 </div>
 <span class="spacer"></span>
 <div class="seg" id="langSeg" role="group" aria-label="Language / Langue"><button data-l="fr" aria-pressed="false" lang="fr">FR</button><button data-l="en" aria-pressed="false" lang="en">EN</button></div>
 <button id="bRules" title="Regulation, standards and guides">Rules</button>
 <button id="bReport" title="Download a text report of this session">Report</button>
 <button id="bAbout" title="About and help">?</button>
</header>
<div id="stageBar">
 <div class="grp"><span class="lbl" id="netLbl">Connection</span>
 <div class="seg" id="netSeg" role="group" aria-label="Connection">
  <button data-n="0" class="on" aria-pressed="true">Standalone machine</button>
  <button data-n="1" aria-pressed="false">Plant network</button>
 </div></div>
 <div class="grp"><span class="lbl" id="rmLbl">Remote maintenance</span>
 <div class="seg" id="rmSeg" role="group" aria-label="Remote maintenance">
  <button data-r="none" class="on" aria-pressed="true">None</button>
  <button data-r="plant" aria-pressed="false">Through the plant</button>
  <button data-r="4g" aria-pressed="false">4G modem</button>
 </div></div>
 <span id="stageDesc"></span>
</div>
<div id="main">
 <div id="view"><div id="prot" aria-live="polite"></div><div id="safMenu" hidden role="dialog" aria-modal="false"></div><svg id="svg" viewBox="0 0 960 610" role="group" aria-label="Workshop architecture"></svg></div>
 <aside id="side"></aside>
</div>
<div id="modal" role="dialog" aria-modal="true"><div id="modalBox"><button id="mClose" aria-label="Close">✕</button><div id="mBody"></div></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NS="http://www.w3.org/2000/svg";
const VERSION="1.0 beta";

/* ---------- architecture levels ---------- */
const STAGES={
 1:"The machine works on its own: PLC, operator panel, drive, guard door. A technician plugs in a programming laptop now and then.",
 2:"The machine is connected to the plant network, in a computer-integrated manufacturing (CIM) set-up: supervision, MES / ERP server, office PCs with e-mail and internet.",
 3:"The machine builder reaches it from outside for remote maintenance, through the plant's internet router and a remote gateway.",
 4:"The machine builder reaches it from outside through a 4G modem fitted in the machine cabinet, with its own SIM card: the link does not go through the plant network."
};

/* availability: 1 always · 2 plant network · 3 remote maintenance through the plant · 4 4G modem · 5 any remote maintenance · 6 plant network or 4G modem · 7 plant network and 4G modem */
function ok(st){switch(st){case 1:return true;case 2:return S.net;case 3:return S.rm==="plant";case 4:return S.rm==="4g";case 5:return S.rm!=="none";case 6:return S.net||S.rm==="4g";case 7:return S.net&&S.rm==="4g";case 8:return S.safw==="bus";case 9:return S.net&&S.safw==="bus"}return false}
function needTxt(st){return {2:T("needs the plant network","demande le réseau de l'usine"),3:T("needs remote maintenance through the plant","demande la télémaintenance par l'usine"),4:T("needs the 4G modem","demande le modem 4G"),5:T("needs remote maintenance","demande une télémaintenance"),6:T("needs a connection","demande un raccordement"),7:T("needs the plant network and the 4G modem","demande le réseau de l'usine et le modem 4G"),8:T("needs a safety controller on a bus (« choose » on the SAFE box)","demande un automate de sécurité sur bus (« choisir » sur la case SAFE)"),9:T("needs the plant network and a safety controller on a bus","demande le réseau de l'usine et un automate de sécurité sur bus")}[st]||""}
function archKey(){return (S.net?"p":"s")+({none:"0",plant:"p","4g":"4"}[S.rm])}
function archTxt(k){k=k||archKey();return (k[0]==="p"?T("plant network","réseau de l'usine"):T("standalone machine","machine seule"))+", "+({0:T("no remote maintenance","sans télémaintenance"),p:T("remote maintenance through the plant network","télémaintenance par le réseau de l'usine"),4:T("remote maintenance by 4G modem","télémaintenance par modem 4G")}[k[1]])}
function archDesc(){return STAGES[S.net?2:1]+(S.rm==="plant"?" "+STAGES[3]:S.rm==="4g"?" "+STAGES[4]:"")}

/* ---------- devices (x,y = centre in the 960×610 drawing) ---------- */
const DEV={
 inet:  {x:480,y:40, l:"Internet",g:"WWW",s:"",st:6},
 vendor:{x:840,y:40, l:"Machine builder",g:"EXT",s:"remote technician",st:5},
 office:{x:130,y:128,l:"Office PC",g:"PC",s:"e-mail, web",st:2},
 mes:   {x:330,y:128,l:"MES / ERP server",g:"SRV",s:"orders, recipes",st:2},
 router:{x:640,y:128,l:"Internet router",g:"RTR",s:"plant entrance",st:2},
 eng:   {x:130,y:246,w:142,l:"Engineering PC",g:"ENG",s:"PLC programming",st:1},
 scada: {x:330,y:246,l:"Supervision",g:"SCADA",s:"screens, history",st:2},
 gw:    {x:840,y:246,l:"Remote gateway",g:"VPN",s:"for the builder",st:3},
 usb:   {x:110,y:388,l:"USB stick",g:"USB",s:"technician's",st:1,small:1},
 sw:    {x:480,y:345,l:"Cell switch",g:"SW",s:"Ethernet",st:1},

   known:["The controllers were online so that refrigeration contractors could diagnose faults and change settings remotely; installation guides explained how to forward internet traffic to them through the store's router.","A security firm counted about 13,000 refrigeration management services exposed on the internet in 99 countries; most of one manufacturer's exposed systems ran firmware older than the version that fixes known flaws. These figures count exposed systems, not confirmed attacks.","Responsibility was split between the contractor (software), the store (equipment) and its IT (internet connection): no single party saw the whole exposed service.","Official report of 9 November 2026 (CERT-FR, CERTFR-2026-CTI-009), from the French cyber crisis coordination centre C4 (ANSSI, COMCYBER, DGA, DGSE, DGSI): the refrigeration controllers of about 700 retail sites were compromised during the night of 11 to 12 October 2026; their defrosting parameters were set to high temperatures, causing large losses of goods and, in at least 15 cases, fire starts. Food businesses were hit too, and small hydroelectric plants were targeted at the same time, with moderate effects.","The report attributes the attack, on a body of evidence (shared attack infrastructure, an internet scanning tool, claims relayed by an associated propaganda channel, traces of Farsi), to Shahid Kaveh, an offensive cyber unit of Iran's Islamic Revolutionary Guard Corps. It notes that the unit has carried out mass reconnaissance of industrial control equipment using Modbus on port 502."],
   unknown:["How each site was entered is not fully public: some sources point to flaws in old, unsupported versions, others to access credentials obtained by the attackers.","Reported temperatures vary between sources (50 °C to 80 °C).","The official report does not describe how the controllers were entered. It does not mention the European wave of 2 November: nothing establishes that it had the same authors or method."],
   src:[["Euronews, 2 November 2026","https://www.euronews.com/2026/11/02/why-are-supermarket-fridges-connected-to-the-internet"],["Toute l'Europe, November 2026","https://www.touteleurope.eu/economie-et-social/des-refrigerateurs-de-supermarches-vises-par-une-nouvelle-cyberattaque-dans-neuf-pays-europeens/"],["CERT-FR, CERTFR-2026-CTI-009, report of the C4, 9 November 2026 (official source)","https://cert.cyber.gouv.fr/cti/CERTFR-2026-CTI-009/"],["Le Figaro with AFP, 2 November 2026",""]],
   map:"Played on the workshop drawing: the refrigeration controller is the PLC; the conveyor stands for the cold room."},
  i:"A refrigeration contractor maintains the store's cold rooms remotely. To make that easy, the controller was made reachable from the internet.",
  s:[
   {a:"inet",b:"router",ev:"simp",t:"The refrigeration controller is reachable from the internet; here, the store's router forwards outside traffic to it (one documented set-up, shown as typical).",k:["seg","rem"],w:"Nothing from the internet reaches the controller directly; the contractor uses an on-demand, secured remote access."},
   {a:"router",b:"plc",ev:"hyp",t:"The attackers get in, perhaps through known flaws of an old firmware that no longer receives updates (one explanation in the sources; others mention access credentials obtained by the attackers).",k:["fw"],w:"Up-to-date firmware, unsupported controllers replaced: the known flaw is closed."},
   {a:"plc",b:"plc",ev:"fact",t:"With the normal functions of the system, they force continuous defrosting and change the setpoints.",k:[],w:""}
  ],
  im:"stop",it:"The cold rooms warm up for hours: food thrown away, departments emptied.",
  d:["log"],dt:"Change log and temperature alerts read by someone: the unusual change is seen and the store reacts before the food is lost.",
  note:"Once inside, the attacker uses ordinary functions: no measure blocks the last step. The barriers come earlier (no internet exposure, updated or replaced devices), and detection limits the loss. Ask who owns each remote access: here, nobody saw the whole picture."},
 {id:"stux",st:1,t:"Real case · Stuxnet, uranium enrichment (Iran, 2010)",
  real:{when:"Found in June–July 2010; active since at least 2009",where:"Iran: the Natanz uranium enrichment plant is the most probable target",
   what:"Malware carried by USB drives into a Windows network looked for the PLC programming software, slipped hidden blocks into the PLCs that drive the centrifuge motors, and made the motors run outside their normal speed.",
   known:["It spread by USB drives (a flaw in Windows shortcuts) and over the local network; it also copied itself into PLC projects, to reach programming PCs that were not on the network (Symantec dossier, February 2011).","It only woke up on one precise set-up: one PLC family and frequency drives of two makes, expected to run between 807 and 1,210 Hz. It then set them to 1,410 Hz, 2 Hz, then 1,064 Hz, in cycles (same source).","On the infected PC, it hid its blocks from the programming software: the dossier calls it 'a rootkit for PLCs' (same source).","About 1,000 centrifuges were replaced at Natanz in late 2009 or early 2010; a US institute calls Stuxnet 'a reasonable explanation', with questions remaining (ISIS, December 2010)."],
   unknown:["Who brought the first USB drive in, and how: a 'willing or unwilling third party'.","Its real effect on the plant: the link with the broken centrifuges is plausible, not proven.","Its authors: attributed by the press to two states, never officially confirmed."],
   src:[["Symantec, W32.Stuxnet Dossier, version 1.4, February 2011","https://www.cs.umd.edu/class/fall2023/cmsc614/papers/stuxnet-dossier.pdf"],["ISIS, Did Stuxnet take out 1,000 centrifuges at the Natanz enrichment plant?, December 2010","https://isis-online.org/isis-reports/detail/did-stuxnet-take-out-1000-centrifuges-at-the-natanz-enrichment-plant"],["NATO CCDCOE, Cyber Law Toolkit, Stuxnet (2010)","https://cyberlaw.ccdcoe.org/wiki/Stuxnet_(2010)"]],
   map:"Played on the workshop drawing: the engineering PC, the PLC and the conveyor drive stand for the programming PCs, the PLCs and the frequency drives of the centrifuges."},
  i:"A plant network cut off from the internet. Its PLCs drive the motors of the centrifuges through frequency drives.",
  s:[
   {a:"usb",b:"eng",ev:"fact",t:"Infected USB drives bring the malware into the plant's Windows network.",k:["usb"],w:"Barrier assumed for the exercise: files are checked on a decontamination station. In 2010, the malware used flaws unknown at the time and drivers signed with stolen certificates: ordinary checks did not see it."},
   {a:"eng",b:"eng",ev:"fact",t:"It spreads from PC to PC and hides in the PLC projects, until it reaches a PC with the programming software.",k:["pat"],w:"Barrier assumed for the exercise: an up-to-date PC kept for that job only. Here too the flaws were unknown at the time: one barrier is never enough."},
   {a:"eng",b:"plc",ev:"fact",t:"When the PC goes online with the PLCs, it slips its own blocks into their program and hides them from the programming software. A PLC password would not help: the malware works through the authorised PC.",k:[],w:""},
   {a:"plc",b:"drv",ev:"fact",t:"Now and then, the modified program drives the motors far above, then far below, their normal speed.",k:[],w:""}
  ],
  im:"err",it:"Centrifuges wear out and break; on site, nobody understands why.",
  d:["bak"],dt:"Hypothesis for the exercise: comparing the PLC program with the reference copy, from a clean PC, would show the added blocks. In 2010, the code was found by security researchers, not on site.",
  note:"The most sophisticated case known: years of preparation, unknown flaws, stolen certificates. No single measure stops it; what counts is depth (several barriers) and checking the program from a clean machine. And an isolated network is not a protection in itself: USB drives and laptops cross the gap."},
 {id:"triton",st:9,t:"Real case · TRITON, safety controllers (Saudi Arabia, 2017)",
  real:{when:"2017: first entry around May; safety shutdowns on 2 June and 4 August",where:"A petrochemical plant in Saudi Arabia",
   what:"Attackers spent months in the plant's networks, reached the engineering workstation of the safety instrumented system and tried to load their own code into the safety controllers. Their faulty code tripped the controllers: the plant shut down safely, twice.",
   known:["Entry through a badly configured firewall exposed to the internet, then the VPN and a DMZ; then into the industrial network with stolen administrator credentials (CyOTE case study, Idaho National Laboratory).","From the safety engineering workstation, reached by remote desktop, the malware used the controllers' engineering protocol, which has no authentication, and a firmware flaw to get full rights (same source).","The physical key of one safety controller was in the 'program' position (same source).","The first trip was put down to a mechanical fault, and alarms during the downloads were dismissed (same source).","About 7, then 10 days of stoppage; no physical damage, but the targeting 'potentially could have caused major physical damage and loss of human life' (same source)."],
   unknown:["The exact aim of the code: it was faulty and never worked as intended.","How long the attackers would have stayed unseen without their mistake."],
   src:[["Idaho National Laboratory, CyOTE case study: TRITON","https://cyote.inl.gov/content/uploads/24/2025/12/CyOTE-Case-Study_TRITON.pdf"]],
   map:"Played on the workshop drawing: the supervision stands for the historian server, the engineering PC for the safety engineering workstation, the SAFE box for the safety controllers."},
  i:"A process plant whose safety instrumented system runs on networked safety controllers.",
  s:[
   {a:"inet",b:"router",ev:"fact",t:"The attackers get in through a badly configured firewall exposed to the internet.",k:["seg"],w:"Only declared flows pass, and nothing from the internet reaches inside directly."},
   {a:"router",b:"scada",ev:"fact",t:"With stolen administrator credentials, they move into the industrial network, through the historian server.",k:["pwd"],w:"Barrier assumed for the exercise: personal accounts and two-factor login, a stolen password is not enough."},
   {a:"scada",b:"eng",ev:"fact",t:"They reach the safety engineering workstation by remote desktop.",k:["svc"],w:"Remote desktop is disabled on the safety workstation (hardening): no way in from the network."},
   {a:"eng",b:"saf",ev:"fact",t:"They load their code into the safety controllers, through a protocol without authentication; one controller's key is in 'program' position.",k:["saf"],w:"Safety controllers locked away, key in 'run' position, their own password: the code cannot be loaded."}
  ],
  im:"stop",it:"The faulty code trips the safety controllers: the plant shuts down safely, twice. Nobody suspects an attack at first.",
  d:["log"],dt:"Alarms during the downloads were seen, then dismissed: an alert read and taken seriously points to an intrusion, not a mechanical fault.",
  note:"Here the safety function did its job: it shut the plant down. But it was itself the target. The lessons: a key switch left in 'program', a remote desktop open to the safety workstation, alarms explained away. Networked safety is a cybersecurity matter too (Machinery Regulation, Annex III 1.2.1)."},
 {id:"hydro",st:2,t:"Real case · Ransomware at an aluminium producer (2019)",
  real:{when:"First infection in December 2018; ransomware on 19 March 2019",where:"A large Norwegian aluminium producer: about 170 sites in 40 countries",
   what:"After an infected e-mail attachment, attackers spent three months in the network, then encrypted thousands of servers and PCs. Several plants stopped; others ran by hand. The company refused to pay and restored its systems from backups.",
   known:["An employee opened an infected attachment, sent from a trusted customer's address; the antivirus found it days later, 'already too late' (Microsoft, December 2019).","The attackers took administrator credentials and pushed the ransomware from the company's own central servers (same source).","Production stopped at several plants; others switched to manual operation, with pen and paper, to finish orders; cost close to 71 million dollars (same source).","No ransom paid; systems restored from trusted backups; daily public communication (same source)."],
   unknown:["Which plant devices (PLCs, panels) were directly hit: the source speaks of servers and PCs."],
   src:[["Microsoft, article on the ransomware attack against the aluminium producer, 16 December 2019","https://news.microsoft.com/source/features/digital-transformation/hackers-hit-norsk-hydro-ransomware-company-responded-transparency/"]],
   map:"Played on the workshop drawing: the supervision stands for the central servers; the supervision and the engineering PC for the plant computers."},
  i:"A group with plants in many countries, all on one company network.",
  s:[
   {a:"inet",b:"office",ev:"fact",t:"An employee opens an infected attachment, sent from a trusted customer's address.",k:["aw"],w:"Barrier assumed for the exercise: he finds the request odd and checks with the customer by phone before opening it."},
   {a:"office",b:"scada",ev:"simp",t:"Over three months, the attackers take administrator accounts and reach the central servers.",k:["pwd"],w:"Personal administrator accounts with two-factor login: stolen passwords are not enough."},
   {a:"scada",b:"eng",ev:"fact",t:"From those servers, they push the ransomware to thousands of PCs and servers, in offices and plants.",k:["seg"],w:"Plant networks are separated from the company network: the encryption stops at the office side."}
  ],
  im:"stop",it:"Several plants stop; others run by hand, with pen and paper, to finish orders.",
  d:["log"],dt:"The antivirus saw the first infection days later: an alert read and acted on at once (PC isolated, passwords changed) is what gives the head start.",
  rec:["Trusted backups: the company restored its systems from them, without paying.","No usable backup: pay without any guarantee, or rebuild everything."],
  note:"Three months between the first e-mail and the encryption: time that detection could have used. Not paying was possible because the backups were good. Telling the truth every day kept customers and staff on board."},
 {id:"ukr",st:3,rk:"manual",t:"Real case · Power grid cut remotely (Ukraine, 2015)",
  real:{when:"23 December 2015",where:"Ukraine: three regional electricity distribution companies",
   what:"After months of preparation, attackers opened circuit breakers in substations from the operators' own control screens. About 225,000 customers lost power for several hours; operators restored it by hand.",
   known:["Entry by spear-phishing: Office documents with macros installed malware (BlackEnergy 3); no exploit of an unknown flaw was seen (SANS and E-ISAC, March 2016).","The attackers harvested legitimate accounts and came into the control network through VPNs, which seem to have had no two-factor login (same source).","They used existing remote administration tools and the operators' HMIs to open the breakers (same source).","They also wrote bad firmware into serial-to-Ethernet gateways in substations (blocking remote recovery), wiped PCs and some logs with KillDisk, and flooded a call centre with phone calls (same source).","Power came back within hours, but the companies kept operating in a degraded, partly manual mode afterwards (same source)."],
   unknown:["The exact sequence inside each company varies, and not every detail is public.","Attribution is outside the scope of this exercise."],
   src:[["SANS and E-ISAC, Analysis of the Cyber Attack on the Ukrainian Power Grid, 18 March 2016","https://pnrs.ensosp.fr/layout/set/print/content/download/47570/777315/file/E-ISAC_SANS_Ukraine_DUC_5.pdf"]],
   map:"Played on the workshop drawing: the remote gateway stands for the VPN, the operator panel for the control screens, the conveyor drive for the breakers."},
  i:"Electricity distribution companies run their substations from control centres, with remote access for maintenance.",
  s:[
   {a:"inet",b:"office",ev:"fact",t:"Office employees open documents with macros, received by e-mail: the malware settles in.",k:["aw"],w:"Barrier assumed for the exercise: staff trained to refuse macros in unexpected documents and to report the e-mail."},
   {a:"office",b:"office",ev:"fact",t:"For months, the attackers harvest legitimate accounts and map the network.",k:["log"],w:"Hypothesis: logins at odd hours and unusual connections are seen and acted on, the intrusion is found before the cut."},
   {a:"inet",b:"gw",ev:"fact",t:"With those accounts, they come into the control network through the VPN, without a second login factor.",k:["rem"],w:"Remote access with two-factor login, opened on demand: stolen passwords are not enough."},
   {a:"gw",b:"hmi",ev:"fact",t:"From the operators' own screens, they open the breakers, substation after substation.",k:[],w:""},
   {a:"hmi",b:"drv",ev:"fact",t:"They break the gateways' firmware, wipe the PCs and flood the call centre, to slow down recovery.",k:[],w:""}
  ],
  im:"stop",it:"About 225,000 customers without power for several hours; operators drive to substations and close breakers by hand.",
  d:["log"],dt:"Hypothesis for the exercise: unusual VPN sessions, read by someone, show the intrusion before the cut.",
  rec:["Manual operation known and practised: the operators restored power within hours.","Without manual procedures, the outage would last as long as the systems take to rebuild."],
  note:"The attackers used the operators' own tools: once inside, nothing looks abnormal. The barriers come earlier (phishing, two-factor remote access, segmentation), and the ability to run by hand limits the damage."},
 {id:"pipe",st:3,t:"Real case · Fuel pipeline stopped as a precaution (USA, 2021)",
  real:{when:"7 to 12 May 2021",where:"United States: a fuel pipeline of more than 5,500 miles, about 260 delivery points in 13 states",
   what:"A ransomware attack hit the company's IT systems. Not knowing how far it went, the operator shut the whole pipeline down in about fifteen minutes, to keep the malware away from the control network. Service resumed five days later; the company paid the ransom.",
   known:["A ransom note was found on an IT system just before 5:00 on 7 May; the pipeline shutdown started at 5:55 and was complete by 6:10 (CEO's written testimony to the US Senate, 8 June 2021).","The attacker 'exploited a legacy virtual private network (VPN) profile that was not intended to be in use' (same source).","The shutdown aimed to keep the malware from reaching the control network (OT) (same source).","Some local lines were run by hand within hours; full service resumed on the evening of 12 May (same source).","The CEO decided to pay the ransom (same source)."],
   unknown:["How the attacker got the VPN credentials: 'still under investigation' at the time of the testimony.","Whether the control network itself was reached: the shutdown was a precaution."],
   src:[["Written testimony of the pipeline operator's CEO to the US Senate Homeland Security Committee, 8 June 2021","https://www.hsgac.senate.gov/imo/media/doc/Testimony-Blount-2021-06-08.pdf"]],
   map:"Played on the workshop drawing: the remote gateway stands for the VPN, the MES server for the company IT, the PLC for the pipeline control."},
  i:"A pipeline operator with remote access for its staff, through a VPN.",
  s:[
   {a:"inet",b:"gw",ev:"fact",t:"The attacker gets in through an old VPN profile, no longer meant to be used.",k:["rem"],w:"Every remote access is listed and closed when no longer needed: the old profile does not exist any more."},
   {a:"gw",b:"gw",ev:"hyp",t:"He logs in with a valid password; how he got it was not established.",k:["pwd"],w:"Barrier assumed for the exercise: personal accounts and two-factor login, a password alone is not enough."},
   {a:"gw",b:"mes",ev:"fact",t:"The ransomware encrypts IT systems; a ransom note is found at dawn.",k:["seg"],w:"Barrier assumed for the exercise: the VPN only reaches what it is declared for, through a filtered conduit."},
   {a:"mes",b:"plc",ev:"fact",t:"Unsure how far it went, the operator shuts the whole pipeline down, in about fifteen minutes.",k:[],w:""}
  ],
  im:"stop",it:"The pipeline stops for five days; some lines run by hand; the company pays the ransom.",
  d:["log"],dt:"Hypothesis for the exercise: an unexpected login on an old VPN profile, seen and acted on, stops the attack before the encryption.",
  rec:["Backups and separated networks: restart quickly, and show that the control network is clean.","Without them: a longer stop, or paying, with no guarantee."],
  note:"Whether the control network was reached was not established: the stop was decided as a precaution. Knowing every remote access, separating IT from OT, and being able to prove the OT is clean is what avoids such a stop."},
 {id:"steel",st:2,t:"Real case · Steel plant blast furnace (Germany, 2014)",

   unknown:["The company, the date and the attackers have never been disclosed, nor any technical detail.","The BSI report itself was not read here: its content comes from the press and an article quoting it. A SANS article describes the progression up to the furnace as a hypothetical scenario: beyond 'massive damage', details should be taken with caution."],
   src:[["BSI, The State of IT Security in Germany 2014 (official report; not read directly for this sheet)","https://www.bsi.bund.de/SharedDocs/Downloads/EN/BSI/Publications/Securitysituation/IT-Security-Situation-in-Germany-2014.pdf?__blob=publicationFile&v=3"],["t-online, « BSI-Sicherheitsbericht: Hacker sabotieren deutsches Stahlwerk », 18 December 2014","https://www.t-online.de/digital/aktuelles/id_72215736/bsi-sicherheitsbericht-hacker-sabotieren-deutsches-stahlwerk.html"],["SANS (M. Assante), Computerworld, 27 February 2015","https://www.sans.org/media/press/1503-Produktionsanlagen-SANS.pdf"],["NATO CCDCOE, Cyber Law Toolkit, Steel mill in Germany (2014)","https://cyberlaw.ccdcoe.org/wiki/Steel_mill_in_Germany_(2014)?oldid=2431"]],
   map:"Played on the workshop drawing: the PLC and the drive stand for the control of the blast furnace."},
  i:"A steel plant whose office and production networks are linked.",
  s:[

   {a:"office",b:"scada",ev:"fact",t:"Step by step, the attackers work their way into the production networks.",k:["seg"],w:"Firewalls between office and production, only declared flows: the attackers stay on the office side."},

  d:["log"],dt:"Hypothesis for the exercise: the progression from office to production networks, seen in the logs, is stopped before the controls fail.",
  note:"One of the first public cases of physical damage caused by a cyberattack on an industrial plant. Few details are public: what matters is the path, office then production, which a firewall between the two would have cut."}
