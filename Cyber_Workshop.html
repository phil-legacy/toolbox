function aboutEN(){return `<h2>Cyber Workshop v${VERSION}</h2>
<p>A hands-on introduction to the cybersecurity of automated machines and industrial networks. No lecture: you look at a workshop, you play attacks against it and you handle an incident.</p>
<h3>Learning objectives</h3>
<ul><li>Spot the usual weaknesses of an automated machine, and see how they grow as it gets connected (standalone, plant network, remote maintenance).</li>
<li>Explain where a measure acts on the path of an attack, and what it costs production.</li>
<li>Tell apart preventing an attack, limiting its impact and recovering production; and tell apart cybersecurity, machine safety and dependability.</li>
<li>Apply the first reflexes when an incident happens.</li>
<li>Know what the Machinery Regulation requires on cybersecurity, and when you become the manufacturer.</li></ul>
<h3>Architecture</h3>
<p>Two choices set the architecture. <b>Connection</b>: the <b>standalone machine</b> (PLC, operator panel, drive, guard safety, a programming laptop now and then), or connected to the <b>plant network</b> (supervision, MES / ERP, office PCs, internet). <b>Remote maintenance</b>: none, <b>through the plant network</b> (internet router and remote gateway), or by a <b>4G modem on the machine</b>, with its own SIM card, which goes around the plant network. Each choice adds doors; the flaws, scenarios and measures follow.</p>
<h3>1 · Hunt the flaws</h3>
<p>Click a device; for each line choose <b>Flaw</b> or <b>Fine</b>. Each answer comes with the good practice. <b>Apply the measure</b> switches it on for the attacks. One measure covers every flaw of the same kind: when it is already on, the line says <b>Already applied</b> and where it was switched on. Clicking it again removes the measure everywhere.</p>
<h3>2 · Attacks</h3>
<p>Two tabs: <b>Training</b> (theoretical scenarios) and <b>Real cases</b>. Three stages. <b>1 · Choose the measures</b>: at the start, those of the hunt; buttons None, My measures (hunt), All. <b>2 · Watch the attack</b>: step by step or all at once; the red dashed line shows where the attack goes, a green shield the barrier that stopped it. <b>3 · Read the result</b>: prevented, detected, impact, recovery; then change the measures and replay. The debrief separates what was observed (the step that got through, the step that stopped the attack) from the steps not reached and their potential barriers. Every run is kept with the measures in place at that moment: replay the same attack without and then with a measure, and the report shows both runs.</p>
<h3>Guard safety</h3>
<p>Click <b>choose</b> on the SAFE box of the drawing to choose how the guard safety is built. <b>Hardwired safety</b> (relay, contacts in series): nothing for the network to reach, machine safety rather than cybersecurity. <b>Safety PLC / fieldbus</b>: the safety runs in a programmable controller on the network, which becomes a cybersecurity point (SAF: is it protected?). Whether a safety function limits the impact of an attack depends on the architecture and on the hazard: each scenario says which function acts, or why none does.</p>
<h3>Real cases</h3>
<p><b>Real cases</b> tab of mode 2: each case opens on what happened, then is replayed on the workshop with your measures. Eight cases: Stuxnet (2010), the German steel plant (2014), the Ukrainian power grid (2015), TRITON (2017), ransomware at an aluminium producer (2019), the pipeline stopped as a precaution (2021), and two attacks that really happened (a water booster station in the USA in 2023, supermarket refrigeration in Europe in 2026). Each one says what is known, what is not, and where it comes from. The steps are simplified and played on the workshop drawing.</p>
<h3>3 · Incident drill</h3>
<p>The attack has happened. The clock moves on with each decision: choose what to do, step by step; each answer is explained and the machine on the drawing follows your choices. The result separates knowledge (right choices) from what your defences let you carry out without hindrance.</p>
<h3>4 · Regulation</h3>
<p>The essentials of the cybersecurity side of the Machinery Regulation (dates, points 1.1.9 and 1.2.1, substantial modification, safety software), then twelve cases to decide (ten on the Machinery Regulation, two on the CRA), each explained from the official text.</p>
<h3>Report</h3>
<p>Downloads a text summary of the session: level, hunt, measures, attack runs, incidents, regulation cases.</p>
<h3>Protection bar</h3>
<p>Above the drawing: measures in place, attacks stopped (each possible scenario replayed silently with your measures), and the colour under each device: covered, partly, not covered, not examined in the hunt.</p>
<h3>Language</h3>
<p>FR / EN at the top switches the whole tool. Switching restarts the attack scenario in progress.</p>
<h3>Limits</h3>
<p>A teaching simulation: no real attack tool, no network access, nothing leaves this page. Scenarios are simplified and deterministic: here a measure stops a step or not, whereas in reality a measure reduces a risk, never to zero. The machine animation shows the effect, not a real process. The regulatory summaries are ours: read the official texts.</p>
<h3>Credits</h3>
<p class="small">Idea and specification: Philippe RAYMOND. Code: Claude (Anthropic). Regulatory sources: Regulation (EU) 2023/1230 and 2024/2847, IEC 62443, ANSSI guides, INRS (summarised, see Rules). Real cases: press and agency sources listed in each case.</p>
<p class="small">© 2026 Philippe RAYMOND · Licence CC BY-NC-ND 4.0<br>Official version: phil-legacy.github.io/toolbox</p>`}
