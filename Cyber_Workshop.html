 ZONES:[{t:"Internet"},{t:"Zone bureau (IT)"},{t:"Zone exploitation : supervision, ingénierie"},{t:"Zone cellule : commande de la machine"},{t:"Machine"}],
 M:{
  pwd:{n:"Mots de passe personnels et robustes ; aucun compte d'usine par défaut",c:"Des comptes à créer, et à supprimer au départ des personnes ; aucun identifiant partagé."},
  plc:{n:"Programme automate protégé par mot de passe : modifications réservées aux techniciens habilités",c:"Chaque modification demande un technicien habilité."},
  saf:{n:"Automate de sécurité protégé : mot de passe propre, distinct du programme standard, armoire fermée, chaque modification de sécurité tracée",c:"Un mot de passe distinct et une procédure validée pour chaque modification de sécurité."},
  usb:{n:"Règle des supports amovibles : fichiers contrôlés sur une station de décontamination, ports USB inutilisés condamnés",c:"Quelques minutes par transfert de fichier."},
  pat:{n:"PC d'ingénierie maintenu : mises à jour, antivirus, ni messagerie ni web",c:"Mises à jour testées, puis installées pendant les arrêts programmés."},
  fw:{n:"Appareils tournés vers d'autres réseaux ou vers internet (routeur, passerelle ou modem, pupitre, automate) tenus à jour ; ceux qui ne reçoivent plus de correctifs de sécurité, remplacés",c:"Mises à jour pendant les arrêts programmés ; remplacer un vieux routeur ou une passerelle a un coût. Un variateur que seul l'automate peut joindre n'est pas prioritaire."},
  bak:{n:"Sauvegardes hors ligne, gardées déconnectées, et copie de référence du programme avec son empreinte (somme de contrôle) ; restauration testée",c:"Une sauvegarde après chaque modification validée ; un essai de restauration par an."},
  log:{n:"Journal des modifications et détection : qui a changé quoi, et quand ; appareils inconnus et connexions inhabituelles repérés ; alertes lues par quelqu'un",c:"Quelqu'un doit lire les alertes et le journal."},
  aw:{n:"Sensibilisation du personnel : hameçonnage, clés USB inconnues, signaler vite",c:"Environ une heure par an, plus des rappels."},
  svc:{n:"Durcissement : services inutiles (web, transfert de fichiers, console distante) et ports libres du switch désactivés",c:"Un port de rechange doit être rouvert à la demande."},
  seg:{n:"Zones et conduits : pare-feu entre bureau, exploitation et cellule ; seuls les flux déclarés passent",c:"Chaque nouveau flux doit être déclaré ; une règle mal écrite peut couper le MES de la machine."},
  pro:{n:"Un protocole qui vérifie qui parle : OPC UA sécurisé, ou Modbus Security (Modbus dans TLS avec certificats), au lieu du Modbus TCP classique",c:"Des certificats à gérer ; beaucoup d'appareils existants ne parlent que le Modbus TCP classique : cela attend souvent un remplacement de matériel."},
  rem:{n:"Accès distant à la demande : fermé par défaut, ouvert pour l'intervention, double authentification, session enregistrée ; chaque accès distant recensé et connu de l'usine",c:"Le constructeur appelle d'abord ; un dépannage de nuit demande un appel de plus."}
 },
 HUNT:{
  plc:[
   {t:"Accès au programme : aucun mot de passe (réglage d'usine).",w:"N'importe qui, avec un portable sur le réseau, peut lire et modifier le programme. Mettez un mot de passe d'accès et gardez-le personnel."},
   {t:"Niveau de protection : lecture et écriture complètes depuis n'importe quel appareil raccordé.",w:"Utilisez le niveau de protection de l'automate : lecture seule sans mot de passe, modifications du programme réservées aux personnes habilitées."},
   {t:"Serveur web intégré : activé, personne ne s'en sert.",w:"Un service que personne n'utilise est une porte que personne ne surveille. Désactivez-le."},
   {t:"Micrologiciel : version à jour, notes de version lues au printemps dernier.",w:"Correct. Les mises à jour du micrologiciel se font pendant les arrêts, après lecture des notes de version."}
  ],
  hmi:[
   {t:"Identifiant : admin / admin.",w:"Les identifiants par défaut figurent dans toutes les notices. Changez-les ; un compte par personne ou par rôle."},
   {t:"Écrans opérateur : seulement les écrans de la machine, le bureau du pupitre est verrouillé.",w:"Bien : l'opérateur ne peut pas ouvrir d'autres programmes sur le pupitre."},
   {t:"Écran web distant : activé, joignable depuis internet à travers le routeur.",w:"Un pupitre opérateur ne doit jamais être joignable depuis internet. Désactivez l'écran web ou gardez-le dans la zone cellule."}
  ],
  drv:[
   {t:"Vitesse et accélération : écrites par l'automate sur le bus de terrain, comme prévu dans le programme ; aucun autre appareil n'est paramétré pour dialoguer avec le variateur.",w:"Correct. Le variateur obéit à qui le joint sur le réseau de la cellule : ce qui le protège, c'est que personne d'autre ne puisse s'y brancher (ports libres du switch désactivés, armoire fermée). Sur beaucoup de machines, le variateur est même sur un réseau de terrain séparé, sur un second port de l'automate."},
   {t:"Filtre de ventilation nettoyé le mois dernier.",w:"Bonne maintenance, mais ce n'est pas un point de cybersécurité."}
  ],
  saf:[
   {t:"Automate de sécurité sur le bus de sécurité : son programme est protégé par le même mot de passe partagé que l'automate standard, et les modifications de sécurité ne sont pas tracées.",w:"Dès que la sécurité passe par un automate programmable en réseau, elle devient aussi un sujet de cybersécurité (cas réel : TRITON, découvert en 2017 ; les attaquants avaient atteint le poste d'ingénierie des automates de sécurité d'une usine de procédé). Donnez au programme de sécurité son propre mot de passe, distinct du programme standard, gardez l'automate sous clé et tracez chaque modification de sécurité. Un mot de passe seul ne garantit pas la fonction de sécurité : la validation après chaque modification et les essais périodiques restent nécessaires."}
  ],
  eng:[
   {t:"Sert aussi à la maison pour la messagerie et le web.",w:"Le PC d'ingénierie dialogue avec l'automate : réservez-le à cet usage."},
   {t:"Antivirus mis à jour il y a 14 mois ; mises à jour désactivées.",w:"Mettez-le à jour pendant les arrêts programmés, après un essai."},
   {t:"La seule copie du programme automate est sur ce portable.",w:"Portable perdu, cassé ou chiffré : plus de programme. Gardez des sauvegardes hors ligne et une copie de référence."},
   {t:"Compte utilisateur personnel avec son propre mot de passe.",w:"Bien : on sait qui s'en est servi."}
  ],
  usb:[
   {t:"Passe du PC de la maison au PC d'ingénierie, sans jamais être contrôlée.",w:"Contrôlez les fichiers sur une station de décontamination avant qu'ils n'entrent dans l'atelier."},
   {t:"Une seconde clé, trouvée sur le parking et étiquetée « Salaires 2026 », a été branchée « pour voir à qui elle est ».",w:"Un piège classique. Ne branchez jamais une clé inconnue : remettez-la au service informatique."}
  ],
  sw:[
   {t:"Ports libres actifs : tout portable branché obtient une adresse.",w:"Désactivez les ports inutilisés ; rouvrez-les à la demande."},
   {t:"Administration du switch : mot de passe d'usine.",w:"Celui qui administre le switch peut détourner tout le trafic."},
   {t:"Armoire fermée à clé, clé détenue par la maintenance.",w:"Bien : l'accès physique est aussi une mesure de sécurité."}
  ],
  osw:[
   {t:"Dans la salle informatique, géré par le service informatique.",w:"Correct : il appartient à l'informatique. Ce qui compte, c'est ce qui le relie à l'atelier : le routeur et les pare-feu."}
  ],
  ssw:[
   {t:"Relié directement au switch de bureau et au switch de cellule : aucun pare-feu entre eux.",w:"C'est cela, un « réseau à plat » : trois switches chaînés, un seul réseau. Placez un pare-feu sur chaque liaison entre zones (zones et conduits)."}
  ],
  office:[
   {t:"Sur le même réseau que l'automate : le PC de bureau peut le joindre directement.",w:"Réseau à plat : un seul PC de bureau infecté atteint tout l'atelier. Séparez les zones, filtrez les conduits."},
   {t:"On n'a jamais montré aux utilisateurs un courriel d'hameçonnage.",w:"La plupart des attaques commencent par un courriel. Apprenez au personnel à le repérer et à le signaler."},
   {t:"Mises à jour automatiques activées.",w:"Bien, pour un PC de bureau."}
  ],
  mes:[
   {t:"Sauvegardes : sur un dossier partagé du même réseau.",w:"Un rançongiciel chiffre aussi les dossiers partagés. Gardez au moins une copie hors ligne."},
   {t:"Envoie les recettes à l'automate en Modbus TCP (sans authentification).",w:"Le Modbus TCP classique n'a aucune authentification : l'automate (serveur) accepte lectures et écritures de tout client qui le joint. Deux réponses : filtrer qui peut joindre l'automate (seul le serveur MES, à travers le pare-feu), ou passer à un protocole qui vérifie qui parle : OPC UA sécurisé, ou Modbus Security, variante de 2018 qui encapsule Modbus dans TLS avec des certificats (port 802), encore rare sur les appareils."}
  ],
  scada:[
   {t:"Aucun journal : connexions et modifications ne laissent pas de trace.",w:"Sans journal, impossible de distinguer une modification légitime d'une attaque (règlement machines, annexe III, 1.1.9 : preuve des interventions)."},
   {t:"Les écrans affichent les alarmes horodatées.",w:"Bien : l'horodatage aide à reconstituer ce qui s'est passé."}
  ],
  router:[
   {t:"Micrologiciel de 2017 : le fabricant ne publie plus de correctifs de sécurité pour ce modèle.",w:"Ce boîtier fait face à internet : ses failles connues restent ouvertes pour de bon. Remplacez les appareils qui ne reçoivent plus de correctifs, en commençant par ceux tournés vers internet."},
   {t:"Règle de filtrage entre bureau et atelier : « tout autorisé ».",w:"Un pare-feu qui laisse tout passer n'est qu'un câble. N'autorisez que les flux déclarés."},
   {t:"Redirection de port entrante, d'internet vers le pupitre opérateur.",w:"Rien ne doit entrer directement d'internet dans la zone cellule."}
  ],
  gw:[
   {t:"Connectée 24 heures sur 24, tous les jours.",w:"Ouvrez l'accès distant pour l'intervention seulement, puis refermez-le."},
   {t:"Compte partagé « vendor », même mot de passe depuis 2019.",w:"Comptes personnels, mot de passe robuste, double authentification."},
   {t:"Aucune trace des sessions distantes.",w:"Enregistrez qui s'est connecté, quand, et ce qui a été fait."}
  ],
  mdm:[
   {t:"Identifiant : le mot de passe d'usine imprimé sur l'étiquette sous le modem ; c'est le même sur tous les modems de ce modèle.",w:"La notice est en ligne : n'importe qui connaît ce mot de passe sans voir le modem. Changez-le à la mise en service : comptes personnels, mot de passe robuste, double authentification."},
   {t:"Allumé et connecté jour et nuit, au cas où le constructeur en aurait besoin.",w:"Ouvrez-le seulement pour l'intervention : un commutateur à clé sur l'armoire, ou une connexion que l'opérateur accepte sur place."},
   {t:"Ni la maintenance ni le service informatique ne savent que le modem est là.",w:"Un accès que personne ne connaît n'est jamais vérifié. Demandez au constructeur la liste des accès distants à la livraison ; c'est l'usine qui décide quand ils s'ouvrent."},
   {t:"Branché directement sur le switch de cellule : il contourne les pare-feu de l'usine.",w:"Quoi que fasse l'usine pour se protéger, cette porte reste ouverte. Convenez avec le service informatique : télémaintenance par la passerelle de l'usine, ou modem déclaré, filtré et ouvert à la demande."},
   {t:"Micrologiciel jamais mis à jour depuis la livraison.",w:"Ce boîtier est tourné vers internet : tenez-le à jour, remplacez-le quand son fabricant ne publie plus de correctifs de sécurité."},
   {t:"Aucune trace des sessions distantes.",w:"Enregistrez qui s'est connecté, quand, et ce qui a été fait."},
   {t:"La liaison vers le serveur du constructeur est un tunnel chiffré (VPN).",w:"Bien : personne ne peut lire les échanges en route. Mais le chiffrement ne vérifie pas qui se connecte : les autres lignes comptent toujours."}
  ]
 },
 SC:{
  usb:{t:"La clé USB du technicien",i:"Un technicien apporte la nouvelle version du programme sur une clé USB. Sans qu'il le sache, son PC de la maison porte un logiciel malveillant ordinaire : il ne fait rien de visible, il se copie seulement sur chaque clé branchée.",
   s:[{t:"La clé est branchée sur le PC d'ingénierie.",w:"Le fichier passe d'abord par la station de décontamination : le logiciel malveillant y est détecté."},
      {t:"Le logiciel malveillant s'exécute sur le PC d'ingénierie.",w:"Le PC est à jour et son antivirus reconnaît le fichier."},
      {t:"Il chiffre les fichiers du PC, dont la seule copie du projet automate.",w:""}],
   it:"La machine tourne encore, mais plus personne ne peut ouvrir ni modifier son programme. À la prochaine panne ou au prochain changement de produit, la ligne reste arrêtée jusqu'à ce qu'on retrouve le projet.",
   dt:"L'alerte du PC est lue tout de suite : le PC est isolé avant la fin du chiffrement.",
   note:"Le cas courant : un logiciel malveillant ordinaire, qui n'est pas écrit pour l'automatisme ; le vrai dégât, c'est le projet perdu. Un logiciel malveillant qui modifie lui-même le programme de l'automate a existé (Stuxnet, 2010), mais c'était une attaque préparée pendant des années contre un seul site."},
  lapt:{t:"Un portable dans l'armoire",i:"Un prestataire vient régler le convoyeur. Pour consulter le programme de l'automate, il ouvre l'armoire et branche son propre portable sur un port libre du switch de cellule.",
   s:[{t:"Le portable obtient une liaison sur le réseau de cellule.",w:"Les ports libres du switch sont désactivés : pas de liaison. La maintenance ouvre un port pour l'intervention, et sait qui est branché."},
      {t:"Son logiciel de programmation trouve l'automate et se connecte : aucun mot de passe demandé.",w:"Modifier le programme demande le mot de passe d'un technicien habilité : il peut lire, pas transférer."},
      {t:"Pour « tester vite », il transfère sa propre version du programme, avec un cycle de presse plus court, et repart.",w:""}],
   it:"Le cycle de la presse ne correspond plus au programme validé : pièces rebutées, et personne ne sait quelle version tourne.",
   dt:"Le journal des modifications montre qui a transféré et quand ; la copie de référence montre ce qui a changé : le programme validé est restauré.",
   note:"Pas une attaque : un intervenant de bonne foi. Les mêmes mesures protègent contre la malveillance et contre les modifications non tracées (règlement machines, annexe III 1.1.9 : preuve des interventions, légitimes ou non)."},
  safp:{t:"Le programme de sécurité modifié",i:"Le protecteur passe par le bus de sécurité : l'interrupteur de porte est lu par un module d'entrées de sécurité, et la règle « porte ouverte, couple coupé » se trouve dans le programme de sécurité de l'automate de sécurité (ou du relais de sécurité programmable). Pendant un long réglage, un technicien en a assez que la machine s'arrête à chaque ouverture de la porte.",
   s:[{t:"Depuis le PC d'ingénierie, il se connecte à l'automate de sécurité : il utilise le même mot de passe partagé que l'automate standard.",w:"Le programme de sécurité a son propre mot de passe, détenu par le responsable sécurité, et l'automate est sous clé : il ne peut pas se connecter. Chaque modification de sécurité passe par une procédure validée."},
      {t:"Il neutralise l'entrée de la porte dans le programme de sécurité (ou la force) et transfère, « juste pour les essais ».",w:""}],
   it:"La machine tourne porte ouverte. La modification « provisoire » reste, et l'opérateur suivant n'en sait rien.",
   dt:"Chaque modification donne au programme de sécurité une nouvelle signature (somme de contrôle), et elle est enregistrée (qui, quand) : elle est vue au contrôle suivant, et le programme validé est remis.",
   note:"Pas une attaque : une faute de l'intervenant. Mais dès que la sécurité passe par un automate programmable en réseau, son programme est joignable comme les autres, par un collègue pressé ou par un attaquant (TRITON, 2017, a atteint les automates de sécurité d'un site par le poste d'ingénierie). Aucune autre fonction de sécurité ne rattrape celle-ci. Un mot de passe ne remplace ni la validation ni les essais périodiques (règlement machines, annexe III 1.2.1)."},
  mail:{t:"Rançongiciel venu d'un courriel",i:"Un employé de bureau reçoit une facture par courriel.",
   s:[{t:"Il ouvre la pièce jointe : le PC de bureau est infecté.",w:"Il reconnaît le piège et signale le courriel sans l'ouvrir."},
      {t:"Le logiciel malveillant se propage sur le réseau à plat jusqu'à la supervision et au PC d'ingénierie.",w:"Le pare-feu entre bureau et exploitation ne laisse passer que les flux déclarés : la propagation s'arrête au bureau."},
      {t:"Il chiffre la supervision et le PC d'ingénierie, deux PC sous Windows. Le pupitre opérateur et l'automate continuent de fonctionner : ils ont leur propre système.",w:"Postes durcis et à jour : la faille connue qu'exploite le logiciel malveillant est fermée."}],
   it:"Les écrans de supervision affichent une demande de rançon : plus de vues, plus d'historiques, plus d'ordres du MES. L'usine arrête la production par précaution, le temps de savoir jusqu'où l'attaque est allée.",
   dt:"L'alerte levée par le premier PC infecté donne une longueur d'avance.",
   note:"Un rançongiciel de bureau ne chiffre pas un pupitre classique (système embarqué) ; il peut chiffrer un pupitre PC sous Windows. L'essentiel de la perte vient de l'arrêt par précaution : en 2019, un producteur d'aluminium a fait tourner plusieurs usines à la main pendant des semaines après une telle attaque."},
  modbus:{t:"N'importe qui peut piloter le convoyeur",i:"L'automate accepte des écritures Modbus TCP sur la commande du convoyeur, parce que le MES s'en sert. Un sous-traitant branche son portable sur un port libre du switch de cellule. Son outil explore le réseau.",
   s:[{t:"Le portable obtient une adresse sur le réseau de la cellule.",w:"Les ports libres du switch sont désactivés : pas de liaison."},
      {t:"Il envoie une écriture Modbus TCP : « marche convoyeur = 1 ». L'automate l'accepte : Modbus n'a pas d'authentification.",w:"L'automate n'accepte que des messages authentifiés (OPC UA sécurisé, ou Modbus Security) : le portable n'est pas reconnu, l'écriture est refusée. Limites : l'authentification prouve qui parle. Elle n'empêche pas une mauvaise commande venue d'un appareil autorisé mais lui-même compromis, et ne remplace pas les contrôles du programme automate (variables autorisées en écriture, vraisemblance, verrouillages)."},
      {t:"Le convoyeur démarre tout seul, pendant qu'un opérateur, porte du protecteur ouverte, dégage une pièce coincée : une intervention courte, faite sans consignation.",w:""}],
   it:"Un démarrage intempestif, avec une personne à la machine.",
   sf:{t:"La porte du protecteur est ouverte : l'interverrouillage maintient le couple du variateur coupé, le convoyeur ne peut pas démarrer. Pour un travail de maintenance, la consignation (énergie séparée et cadenassée) protège de la même façon : aucune commande ne peut démarrer le convoyeur. Ce sont la consignation et les fonctions de sécurité qui protègent les personnes ; la cybersécurité évite les démarrages intempestifs et protège la production."},
   dt:"L'appareil inconnu est détecté sur le réseau.",
   note:"Même avec un pare-feu entre les zones, cette attaque part de l'intérieur de la cellule : la segmentation seule ne l'arrête pas."},
  remote:{t:"Accès distant laissé ouvert",i:"Le constructeur joint la machine par la passerelle de télémaintenance de l'usine. La passerelle reste connectée en permanence.",
   i4:"Le constructeur joint la machine par un modem 4G dans l'armoire, avec sa propre carte SIM, branché sur le switch de cellule. Le modem reste en ligne jour et nuit.",
   s:[{t:"Un balayage automatique trouve la passerelle : des robots interrogent toutes les adresses d'internet, jour et nuit, et répertorient chaque appareil qui répond.",w:"La passerelle est éteinte en dehors des interventions : il n'y a rien à trouver."},
      {t:"Un balayage automatique trouve le modem : des robots interrogent toutes les adresses d'internet, jour et nuit, et répertorient chaque appareil qui répond.",w:"Le modem n'est allumé que pour l'intervention (commutateur à clé sur l'armoire, ou connexion que l'opérateur accepte sur place) : il n'y a rien à trouver."},
      {t:"L'attaquant se connecte avec le compte partagé « vendor », mot de passe inchangé depuis 2019, trouvé dans une liste de mots de passe volés.",w:"Comptes personnels, mots de passe robustes et double authentification : le mot de passe volé ne suffit pas."},
      {t:"Il essaie le mot de passe par défaut de ce modèle de modem : le même sur tous les modems de la série, écrit dans sa notice, qui est en ligne.",w:"Le mot de passe par défaut a été changé à la mise en service ; comptes personnels et double authentification : il ne marche plus."},
      {t:"Depuis la passerelle, il atteint tout le réseau de l'usine, jusqu'à la cellule.",w:"La passerelle n'atteint que la machine déclarée, par un conduit filtré."},
      {t:"Le modem est branché sur le switch de cellule : le voilà sur le réseau de cellule, derrière tous les pare-feu de l'usine.",w:""},
      {t:"Avec le logiciel de programmation de l'automate (souvent téléchargeable librement), il se connecte : aucun mot de passe demandé. Il modifie le cycle de la presse.",w:"Modifier le programme demande le mot de passe d'un technicien habilité : il peut lire, la modification est refusée."}],
   it:"Le cycle de la presse dérive : pièces rebutées, et c'est le nom du constructeur qui est sur la machine.",
   dt:"La session distante est enregistrée (qui, quand) et le programme ne correspond plus à la copie de référence : la modification est vue et annulée.",
   note:"Même histoire, deux chemins : essayez les deux. Par l'usine, les zones et conduits peuvent encore l'arrêter. Par un modem 4G branché dans la cellule, plus rien ne sépare internet de l'automate une fois le mot de passe connu. Demandez au constructeur quels accès distants a la machine, qui peut s'en servir et quand ils s'ouvrent."},
  web:{t:"Le pupitre opérateur sur internet",i:"Pour surveiller la machine depuis chez lui, quelqu'un a ouvert l'écran web du pupitre sur internet.",
   s:[{t:"Un moteur de recherche d'objets connectés répertorie la page web du pupitre. Ces services publics interrogent toutes les adresses d'internet, jour et nuit, et répertorient ce qui répond, souvent avec la marque et la version : n'importe qui peut y chercher un modèle de pupitre.",w:"Aucun flux entrant d'internet vers la cellule : la page n'est pas visible."},
      {t:"L'écran web répond.",w:"L'écran web est désactivé : rien ne répond."},
      {t:"L'identifiant admin / admin fonctionne.",w:"Le compte par défaut n'existe plus."},
      {t:"L'intrus appuie sur « Marche » et modifie la recette.",w:""}],
   it:"La machine démarre sur un ordre à distance que personne n'a donné sur place.",
   sf:{t:"La porte est fermée : l'interverrouillage n'empêche pas un démarrage commandé depuis le pupitre. Le risque de blessure dépend de qui se trouve près de la machine (poste de chargement, régleur). Une fonction de sécurité couvre un danger donné, pas tous les démarrages intempestifs."},
   dt:"La connexion distante est tracée et déclenche une alerte."},
  water:{t:"Cas réel · Station de surpression d'eau (États-Unis, 2023)",
   real:{when:"25 novembre 2023",where:"Aliquippa, Pennsylvanie (États-Unis) : une station de surpression qui maintient la pression de l'eau pour deux communes",
    what:"Des attaquants ont atteint un automate à pupitre intégré, exposé sur internet, et remplacé son écran par leur propre message. Les opérateurs ont passé la station en manuel. Selon le service des eaux, l'eau potable n'a pas été menacée.",
    known:["L'appareil était joignable directement depuis internet (agence américaine de cybersécurité CISA, alerte du 28 novembre 2023).","Premières recommandations de la CISA : changer le mot de passe par défaut, supprimer l'exposition directe à internet ou placer un pare-feu devant, double authentification pour l'accès distant, sauvegarder le programme de l'automate, mettre à jour le micrologiciel.","Un groupe hacktiviste a revendiqué l'attaque ; il visait des appareils d'une origine précise, pas cette commune. Selon le rapport du CERT-FR du 9 novembre 2026, ce nom hacktiviste est l'un des avatars de Shahid Kaveh, l'unité également à l'origine de l'attaque de 2026 contre les contrôleurs de froid (voir l'autre cas réel)."],
    unknown:["Le mode d'entrée exact n'est pas détaillé dans les sources lues ; les recommandations désignent le mot de passe par défaut et le port par défaut."],
    src:[["WaterWorld, 30 novembre 2023"],["CISA (agence américaine de cybersécurité), alerte « Exploitation of Unitronics PLCs used in Water and Wastewater Systems », 28 novembre 2023"],["CERT-FR, CERTFR-2026-CTI-009, 9 novembre 2026 (lien entre la revendication et l'unité Shahid Kaveh)"]],
    map:"Joué sur le dessin de l'atelier : l'automate à pupitre intégré y figure comme le pupitre et l'automate."},
   i:"Un automate à pupitre intégré pilote une station de pompage. Pour la surveiller de partout, on l'a laissé joignable depuis internet.",
   s:[{t:"Le pupitre de l'automate est joignable directement depuis internet, et les attaquants le trouvent.",w:"Aucune exposition directe à internet : l'appareil est derrière un pare-feu, et l'accès distant passe par une passerelle à la demande, avec double authentification."},
      {t:"Ils se connectent, très probablement avec le mot de passe d'usine (les recommandations de la CISA le désignent ; les sources lues ne l'établissent pas).",w:"Le mot de passe par défaut a été changé : la connexion échoue."},
      {t:"Ils remplacent l'écran du pupitre par leur propre message.",w:"Modifier le projet de l'appareil demande un mot de passe de protection que les attaquants n'ont pas (barrière supposée pour l'exercice)."}],
   it:"Le pupitre affiche le message des attaquants. Les opérateurs passent en manuel : le service continue, l'automatisme est perdu jusqu'à la remise en état de l'appareil.",
   dt:"Une alarme prévient aussitôt les opérateurs (dans le cas réel, la station a déclenché une alarme, comme prévu).",
   rec:["Sauvegarde saine du programme : il est rechargé une fois l'entrée refermée.","Pas de sauvegarde du programme : il faut le réécrire ou le redemander à l'intégrateur, pendant que la station tourne en manuel."],
   note:"Rien de sophistiqué : un appareil sur internet et un mot de passe inchangé. Les questions à se poser pour tout accès distant : qui peut se connecter, avec un compte personnel ? Est-il ouvert en permanence ou seulement quand on en a besoin ? Les mots de passe d'usine ont-ils été changés ? Garde-t-on une trace de qui s'est connecté, et quand ? (Questions reprises d'un post d'un ingénieur automaticien sur ce cas, novembre 2026.)"},
  fridge:{t:"Cas réel · Froid de supermarchés (Europe, 2026)",
   real:{when:"Nuit du 11 au 12 octobre 2026 en France (environ 700 sites de la grande distribution, selon le rapport officiel), puis nuit du 2 novembre 2026 dans neuf autres pays européens (presse)",where:"Supermarchés : les régulateurs qui pilotent chambres froides et vitrines réfrigérées",
    what:"Des attaquants ont pris la main à distance sur des régulateurs frigorifiques raccordés à internet. Ils ont forcé un dégivrage continu et modifié les températures : les vitrines se sont réchauffées pendant des heures et des denrées ont été jetées. Le 9 novembre 2026, la France a attribué l'attaque d'octobre à une unité iranienne (voir « Établi »).",
    known:["Les régulateurs étaient en ligne pour que les frigoristes puissent diagnostiquer les pannes et modifier les réglages à distance ; des guides d'installation expliquaient comment leur rediriger le trafic internet à travers le routeur du magasin.","Une société de sécurité a compté environ 13 000 services de gestion du froid exposés sur internet dans 99 pays ; la plupart des systèmes exposés d'un même fabricant tournaient avec un micrologiciel plus ancien que la version qui corrige des failles connues. Ces chiffres comptent des systèmes exposés, pas des attaques confirmées.","Les responsabilités étaient partagées entre le frigoriste (logiciel), le magasin (matériel) et son informatique (connexion internet) : personne ne voyait l'ensemble du service exposé.","Rapport officiel du 9 novembre 2026 (CERT-FR, CERTFR-2026-CTI-009), du Centre de coordination des crises cyber C4 (ANSSI, COMCYBER, DGA, DGSE, DGSI) : les contrôleurs de froid d'environ 700 sites de la grande distribution ont été compromis dans la nuit du 11 au 12 octobre 2026 ; leurs paramètres de dégivrage ont été fixés à de hautes températures, entraînant d'importantes pertes de marchandises et, dans au moins 15 cas, des départs de feu. Des entreprises agroalimentaires ont aussi été touchées, et de petites installations hydroélectriques ont été ciblées en même temps, avec des effets modérés.","Le rapport impute l'attaque, sur un faisceau d'indices (infrastructure d'attaque commune, outil de balayage d'internet, revendication relayée par un organe de propagande associé, traces de farsi), à Shahid Kaveh, unité cyber-offensive du Corps des Gardiens de la révolution islamique d'Iran. Il indique que cette unité mène des reconnaissances massives d'équipements de contrôle industriel avec le protocole Modbus, sur le port 502."],
    unknown:["La façon dont chaque site a été pénétré n'est pas entièrement publique : certaines sources évoquent des failles d'anciennes versions sans support, d'autres des identifiants obtenus par les attaquants.","Les températures rapportées varient selon les sources (de 50 °C à 80 °C).","Le rapport officiel ne décrit pas comment les contrôleurs ont été pénétrés. Il ne mentionne pas la vague européenne du 2 novembre : rien n'établit qu'elle ait les mêmes auteurs ou le même mode opératoire."],
    src:[["Euronews, 2 novembre 2026"],["Toute l'Europe, novembre 2026"],["CERT-FR, CERTFR-2026-CTI-009, rapport du C4, 9 novembre 2026 (source officielle)"],["Le Figaro avec l'AFP, 2 novembre 2026"]],
    map:"Joué sur le dessin de l'atelier : le régulateur frigorifique y figure comme l'automate ; le convoyeur tient lieu de chambre froide."},
   i:"Un frigoriste assure à distance la maintenance des chambres froides du magasin. Pour se simplifier la tâche, le régulateur a été rendu joignable depuis internet.",
   s:[{t:"Le régulateur frigorifique est joignable depuis internet ; ici, le routeur du magasin lui redirige le trafic extérieur (une configuration documentée, présentée comme typique).",w:"Rien d'internet n'atteint directement le régulateur ; le frigoriste passe par un accès distant sécurisé, ouvert à la demande."},
      {t:"Les attaquants entrent, peut-être par des failles connues d'un ancien micrologiciel qui ne reçoit plus de mises à jour (une explication parmi celles des sources ; d'autres évoquent des identifiants obtenus par les attaquants).",w:"Micrologiciel à jour, régulateurs sans support remplacés : la faille connue est fermée."},
      {t:"Avec les fonctions normales du système, ils forcent un dégivrage continu et modifient les consignes.",w:""}],
   it:"Les chambres froides se réchauffent pendant des heures : denrées jetées, rayons vidés.",
   dt:"Journal des modifications et alertes de température lus par quelqu'un : le changement inhabituel est vu et le magasin réagit avant la perte des denrées.",
   note:"Une fois à l'intérieur, l'attaquant se sert de fonctions ordinaires : aucune mesure ne bloque la dernière étape. Les barrières sont en amont (pas d'exposition à internet, appareils à jour ou remplacés), et la détection limite la perte. Demandez à qui appartient chaque accès distant : ici, personne n'avait la vue d'ensemble."},
  stux:{t:"Cas réel · Stuxnet, enrichissement d'uranium (Iran, 2010)",
   real:{when:"Découvert en juin-juillet 2010 ; actif depuis 2009 au moins",where:"Iran : l'usine d'enrichissement d'uranium de Natanz est la cible la plus probable",
    what:"Un logiciel malveillant apporté par des clés USB dans un réseau Windows a cherché le logiciel de programmation des automates, glissé des blocs cachés dans les automates qui pilotent les moteurs des centrifugeuses, et fait tourner ces moteurs hors de leur vitesse normale.",
    known:["Il se propageait par clés USB (une faille des raccourcis Windows) et sur le réseau local ; il se copiait aussi dans les projets d'automates, pour atteindre des PC de programmation qui n'étaient pas en réseau (dossier Symantec, février 2011).","Il ne se réveillait que sur une configuration précise : une famille d'automates et des variateurs de fréquence de deux marques, censés tourner entre 807 et 1 210 Hz. Il les réglait alors à 1 410 Hz, 2 Hz, puis 1 064 Hz, par cycles (même source).","Sur le PC infecté, il cachait ses blocs au logiciel de programmation : le dossier parle d'un « rootkit pour automates » (même source).","Environ 1 000 centrifugeuses ont été remplacées à Natanz fin 2009 ou début 2010 ; un institut américain juge Stuxnet « une explication raisonnable », des questions restant ouvertes (ISIS, décembre 2010)."],
    unknown:["Qui a introduit la première clé USB, et comment : un « tiers, volontaire ou non ».","Son effet réel sur l'usine : le lien avec les centrifugeuses cassées est plausible, pas prouvé.","Ses auteurs : attribués par la presse à deux États, jamais confirmés officiellement."],
    src:[["Symantec, W32.Stuxnet Dossier, version 1.4, février 2011"],["ISIS, Did Stuxnet take out 1,000 centrifuges at the Natanz enrichment plant?, décembre 2010"],["CCDCOE de l'OTAN, Cyber Law Toolkit, Stuxnet (2010)"]],
    map:"Joué sur le dessin de l'atelier : le PC d'ingénierie, l'automate et le variateur du convoyeur tiennent la place des PC de programmation, des automates et des variateurs de fréquence des centrifugeuses."},
   i:"Un réseau d'usine coupé d'internet. Ses automates pilotent les moteurs des centrifugeuses par des variateurs de fréquence.",
   s:[{t:"Des clés USB infectées apportent le logiciel malveillant dans le réseau Windows de l'usine.",w:"Barrière supposée pour l'exercice : les fichiers passent par une station de décontamination. En 2010, le logiciel malveillant utilisait des failles inconnues à l'époque et des pilotes signés avec des certificats volés : les contrôles ordinaires ne le voyaient pas."},
      {t:"Il se propage de PC en PC et se cache dans les projets d'automates, jusqu'à atteindre un PC équipé du logiciel de programmation.",w:"Barrière supposée pour l'exercice : un PC à jour, réservé à cet usage. Là aussi, les failles étaient inconnues à l'époque : une seule barrière ne suffit jamais."},
      {t:"Quand le PC se connecte aux automates, il glisse ses propres blocs dans leur programme et les cache au logiciel de programmation. Un mot de passe automate n'y changerait rien : il passe par le PC autorisé.",w:""},
      {t:"De temps en temps, le programme modifié fait tourner les moteurs bien au-dessus, puis bien au-dessous, de leur vitesse normale.",w:""}],
   it:"Des centrifugeuses s'usent et cassent ; sur place, personne ne comprend pourquoi.",
   dt:"Hypothèse pour l'exercice : comparer le programme des automates avec la copie de référence, depuis un PC sain, ferait apparaître les blocs ajoutés. En 2010, le code a été trouvé par des chercheurs en sécurité, pas sur place.",
   note:"Le cas le plus élaboré connu : des années de préparation, des failles inconnues, des certificats volés. Aucune mesure seule ne l'arrête ; ce qui compte, c'est la profondeur (plusieurs barrières) et la vérification du programme depuis une machine saine. Et un réseau isolé n'est pas une protection en soi : les clés USB et les portables franchissent la coupure."},
  triton:{t:"Cas réel · TRITON, automates de sécurité (Arabie saoudite, 2017)",
   real:{when:"2017 : première intrusion vers mai ; arrêts de sécurité le 2 juin et le 4 août",where:"Un site pétrochimique en Arabie saoudite",
    what:"Des attaquants sont restés des mois dans les réseaux du site, ont atteint le poste d'ingénierie du système instrumenté de sécurité et tenté de charger leur propre code dans les automates de sécurité. Leur code défectueux a déclenché les automates : le site s'est mis à l'arrêt en sécurité, deux fois.",
    known:["Entrée par un pare-feu mal configuré exposé sur internet, puis le VPN et une DMZ ; ensuite vers le réseau industriel avec des identifiants d'administrateur volés (étude de cas CyOTE, Idaho National Laboratory).","Depuis le poste d'ingénierie de sécurité, atteint par bureau à distance, le logiciel malveillant a utilisé le protocole d'ingénierie des automates, sans authentification, et une faille du micrologiciel pour obtenir tous les droits (même source).","La clé physique d'un automate de sécurité était en position « programmation » (même source).","Le premier arrêt a été attribué à une panne mécanique, et des alarmes pendant les chargements ont été ignorées (même source).","Environ 7, puis 10 jours d'arrêt ; aucun dégât matériel, mais le ciblage « aurait pu causer des dégâts matériels majeurs et des pertes humaines » (même source)."],
    unknown:["Le but exact du code : il était défectueux et n'a jamais fonctionné comme prévu.","Combien de temps les attaquants seraient restés invisibles sans leur erreur."],
    src:[["Idaho National Laboratory, étude de cas CyOTE : TRITON"]],
    map:"Joué sur le dessin de l'atelier : la supervision tient la place du serveur d'historique, le PC d'ingénierie celle du poste d'ingénierie de sécurité, la case SAFE celle des automates de sécurité."},
   i:"Un site de procédé dont le système instrumenté de sécurité repose sur des automates de sécurité en réseau.",
   s:[{t:"Les attaquants entrent par un pare-feu mal configuré exposé sur internet.",w:"Seuls les flux déclarés passent, et rien ne vient d'internet directement à l'intérieur."},
      {t:"Avec des identifiants d'administrateur volés, ils passent dans le réseau industriel, par le serveur d'historique.",w:"Barrière supposée pour l'exercice : comptes personnels et double authentification, un mot de passe volé ne suffit pas."},
      {t:"Ils atteignent le poste d'ingénierie de sécurité par bureau à distance.",w:"Le bureau à distance est désactivé sur le poste de sécurité (durcissement) : aucune entrée par le réseau."},
      {t:"Ils chargent leur code dans les automates de sécurité, par un protocole sans authentification ; la clé d'un automate est en position « programmation ».",w:"Automates de sécurité sous clé, clé en position « marche », mot de passe propre : le code ne peut pas être chargé."}],
   it:"Le code défectueux déclenche les automates de sécurité : le site s'arrête en sécurité, deux fois. Personne ne pense d'abord à une attaque.",
   dt:"Des alarmes pendant les chargements ont été vues, puis écartées : une alerte lue et prise au sérieux fait penser à une intrusion, pas à une panne mécanique.",
   note:"Ici, la fonction de sécurité a fait son travail : elle a arrêté le site. Mais c'est elle qui était visée. Les leçons : une clé laissée en « programmation », un bureau à distance ouvert vers le poste de sécurité, des alarmes expliquées trop vite. La sécurité en réseau est aussi une affaire de cybersécurité (règlement machines, annexe III 1.2.1)."},
  hydro:{t:"Cas réel · Rançongiciel chez un producteur d'aluminium (2019)",
   real:{when:"Première infection en décembre 2018 ; rançongiciel le 19 mars 2019",where:"Un grand producteur norvégien d'aluminium : environ 170 sites dans 40 pays",
    what:"Après une pièce jointe infectée, des attaquants sont restés trois mois dans le réseau, puis ont chiffré des milliers de serveurs et de PC. Plusieurs usines se sont arrêtées ; d'autres ont tourné à la main. L'entreprise a refusé de payer et restauré ses systèmes depuis ses sauvegardes.",
    known:["Un employé a ouvert une pièce jointe infectée, envoyée depuis l'adresse d'un client de confiance ; l'antivirus l'a trouvée quelques jours plus tard, « déjà trop tard » (Microsoft, décembre 2019).","Les attaquants ont pris des identifiants d'administrateur et poussé le rançongiciel depuis les serveurs centraux de l'entreprise elle-même (même source).","La production s'est arrêtée dans plusieurs usines ; d'autres sont passées en fonctionnement manuel, avec papier et crayon, pour finir les commandes ; coût proche de 71 millions de dollars (même source).","Aucune rançon payée ; systèmes restaurés depuis des sauvegardes sûres ; communication publique quotidienne (même source)."],
    unknown:["Quels appareils des usines (automates, pupitres) ont été touchés directement : la source parle de serveurs et de PC."],
    src:[["Microsoft, article sur l'attaque par rançongiciel contre le producteur d'aluminium, 16 décembre 2019"]],
    map:"Joué sur le dessin de l'atelier : la supervision tient la place des serveurs centraux ; la supervision et le PC d'ingénierie celle des ordinateurs des usines."},
   i:"Un groupe qui a des usines dans de nombreux pays, toutes sur un même réseau d'entreprise.",
   s:[{t:"Un employé ouvre une pièce jointe infectée, envoyée depuis l'adresse d'un client de confiance.",w:"Barrière supposée pour l'exercice : il trouve la demande étrange et vérifie par téléphone auprès du client avant d'ouvrir."},
      {t:"En trois mois, les attaquants prennent des comptes d'administrateur et atteignent les serveurs centraux.",w:"Comptes d'administrateur personnels, avec double authentification : des mots de passe volés ne suffisent pas."},
      {t:"Depuis ces serveurs, ils poussent le rançongiciel vers des milliers de PC et de serveurs, dans les bureaux et les usines.",w:"Les réseaux des usines sont séparés du réseau de l'entreprise : le chiffrement s'arrête côté bureau."}],
   it:"Plusieurs usines s'arrêtent ; d'autres tournent à la main, avec papier et crayon, pour finir les commandes.",
   dt:"L'antivirus a vu la première infection quelques jours plus tard : une alerte lue et traitée tout de suite (PC isolé, mots de passe changés) donne la longueur d'avance.",
   rec:["Sauvegardes sûres : l'entreprise a restauré ses systèmes à partir d'elles, sans payer.","Aucune sauvegarde utilisable : payer sans aucune garantie, ou tout reconstruire."],
   note:"Trois mois entre le premier courriel et le chiffrement : du temps que la détection aurait pu utiliser. Ne pas payer a été possible parce que les sauvegardes étaient bonnes. Dire la vérité chaque jour a gardé la confiance des clients et du personnel."},
  ukr:{t:"Cas réel · Réseau électrique coupé à distance (Ukraine, 2015)",
   real:{when:"23 décembre 2015",where:"Ukraine : trois compagnies régionales de distribution d'électricité",
    what:"Après des mois de préparation, des attaquants ont ouvert des disjoncteurs dans des postes électriques depuis les écrans de conduite des opérateurs eux-mêmes. Environ 225 000 clients ont été privés de courant pendant plusieurs heures ; les opérateurs l'ont rétabli à la main.",
    known:["Entrée par hameçonnage ciblé : des documents Office avec macros ont installé un logiciel malveillant (BlackEnergy 3) ; aucune faille inconnue n'a été utilisée (SANS et E-ISAC, mars 2016).","Les attaquants ont récupéré des comptes légitimes et sont entrés dans le réseau de conduite par des VPN, apparemment sans double authentification (même source).","Ils ont utilisé les outils d'administration à distance existants et les postes de conduite des opérateurs pour ouvrir les disjoncteurs (même source).","Ils ont aussi écrit un micrologiciel défectueux dans des passerelles série-Ethernet des postes (empêchant la reprise à distance), effacé des PC et des journaux avec KillDisk, et saturé un centre d'appels de coups de téléphone (même source).","Le courant est revenu en quelques heures, mais les compagnies ont ensuite fonctionné en mode dégradé, en partie manuel (même source)."],
    unknown:["Le déroulé exact varie d'une compagnie à l'autre, et tous les détails ne sont pas publics.","L'attribution sort du cadre de cet exercice."],
    src:[["SANS et E-ISAC, Analysis of the Cyber Attack on the Ukrainian Power Grid, 18 mars 2016"]],
    map:"Joué sur le dessin de l'atelier : la passerelle distante tient la place du VPN, le pupitre opérateur celle des écrans de conduite, le variateur du convoyeur celle des disjoncteurs."},
   i:"Des compagnies de distribution d'électricité conduisent leurs postes depuis des centres de conduite, avec un accès distant pour la maintenance.",
   s:[{t:"Des employés de bureau ouvrent des documents avec macros reçus par courriel : le logiciel malveillant s'installe.",w:"Barrière supposée pour l'exercice : un personnel formé à refuser les macros d'un document inattendu et à signaler le courriel."},
      {t:"Pendant des mois, les attaquants récupèrent des comptes légitimes et cartographient le réseau.",w:"Hypothèse : des connexions à des heures inhabituelles sont vues et traitées, l'intrusion est trouvée avant la coupure."},
      {t:"Avec ces comptes, ils entrent dans le réseau de conduite par le VPN, sans second facteur.",w:"Accès distant avec double authentification, ouvert à la demande : des mots de passe volés ne suffisent pas."},
      {t:"Depuis les écrans des opérateurs eux-mêmes, ils ouvrent les disjoncteurs, poste après poste.",w:""},
      {t:"Ils détruisent le micrologiciel des passerelles, effacent les PC et saturent le centre d'appels, pour ralentir la reprise.",w:""}],
   it:"Environ 225 000 clients sans courant pendant plusieurs heures ; des opérateurs vont dans les postes refermer les disjoncteurs à la main.",
   dt:"Hypothèse pour l'exercice : des sessions VPN inhabituelles, lues par quelqu'un, révèlent l'intrusion avant la coupure.",
   rec:["Fonctionnement manuel connu et exercé : les opérateurs ont rétabli le courant en quelques heures.","Sans procédures manuelles, la coupure dure le temps de reconstruire les systèmes."],
   note:"Les attaquants ont utilisé les outils des opérateurs eux-mêmes : une fois à l'intérieur, rien ne paraît anormal. Les barrières sont en amont (hameçonnage, accès distant à double authentification, segmentation), et savoir travailler à la main limite les dégâts."},
  pipe:{t:"Cas réel · Oléoduc arrêté par précaution (États-Unis, 2021)",
   real:{when:"Du 7 au 12 mai 2021",where:"États-Unis : un oléoduc de carburants de plus de 8 800 km, environ 260 points de livraison dans 13 États",
    what:"Un rançongiciel a touché l'informatique de gestion de l'entreprise. Sans savoir jusqu'où il était allé, l'exploitant a arrêté tout l'oléoduc en une quinzaine de minutes, pour tenir le logiciel malveillant à l'écart du réseau de conduite. Le service a repris cinq jours plus tard ; l'entreprise a payé la rançon.",
    known:["Une demande de rançon a été trouvée sur un système informatique juste avant 5 h le 7 mai ; l'arrêt de l'oléoduc a commencé à 5 h 55 et était terminé à 6 h 10 (témoignage écrit du PDG devant le Sénat américain, 8 juin 2021).","L'attaquant a « exploité un ancien profil VPN qui n'était plus censé servir » (même source).","L'arrêt visait à empêcher le logiciel malveillant d'atteindre le réseau de conduite (OT) (même source).","Des lignes locales ont été exploitées à la main en quelques heures ; le service complet a repris le 12 mai au soir (même source).","Le PDG a décidé de payer la rançon (même source)."],
    unknown:["Comment l'attaquant a obtenu les identifiants VPN : « toujours en cours d'enquête » au moment du témoignage.","Si le réseau de conduite lui-même a été atteint : l'arrêt était une précaution."],
    src:[["Témoignage écrit du PDG de l'exploitant devant la commission de la sécurité intérieure du Sénat américain, 8 juin 2021"]],
    map:"Joué sur le dessin de l'atelier : la passerelle distante tient la place du VPN, le serveur MES celle de l'informatique de gestion, l'automate celle de la conduite de l'oléoduc."},
   i:"Un exploitant d'oléoduc dont le personnel dispose d'un accès distant par VPN.",
   s:[{t:"L'attaquant entre par un ancien profil VPN, qui n'était plus censé servir.",w:"Chaque accès distant est recensé et fermé quand il ne sert plus : l'ancien profil n'existe plus."},
      {t:"Il se connecte avec un mot de passe valide ; comment il l'a obtenu n'a pas été établi.",w:"Barrière supposée pour l'exercice : comptes personnels et double authentification, un mot de passe seul ne suffit pas."},

const MS={run:["Running","var(--yes)","normal production"],err:["Erratic","var(--run)","speed and timing drift"],stop:["Stopped","var(--muted)","production lost"],
 unsafe:["DANGER","var(--no)","moving with a person exposed"],cut:["Power cut","var(--no)","uncontrolled stop, clues lost"],safe:["Safe stop","var(--yes)","guard safety cut the motion"]};
function setMachine(m){S.machine=m;if(!mach.st)return;const v=MS[m];mach.st.textContent=v[0];mach.st.setAttribute("fill",v[1]);mach.lamp.setAttribute("fill",v[1]);mach.sub.textContent=v[2];
 mach.man.setAttribute("visibility",(m==="unsafe"||m==="safe")?"visible":"hidden");mach.door.setAttribute("x",(m==="unsafe"||m==="safe")?"800":"780")}
/* Conveyor: 5 parts, 100 px apart, on a 500 px loop. The press (centre x=570) comes down when a part is centred under it
   and leaves a mark on the part. When the machine is erratic, the press timing drifts: the mark is off-centre and the part is scrap. */
let TT=0,last=0,pos=0,cnt={good:0,bad:0},subT=0;
const PART=Array.from({length:5},()=>({mark:null,o:0,px:0,hit:false}));
function resetParts(){cnt.good=0;cnt.bad=0;PART.forEach(q=>{q.mark=null;q.hit=false})}
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function tick(ts){const dt=RM?0:Math.min(.05,(ts-last)/1000||0);last=ts;TT+=dt;
 const m=S.machine;let sp=0;if(m==="run"||m==="unsafe")sp=1;if(m==="err")sp=1.6+.9*Math.sin(TT*2.7);
 pos+=sp*dt*70;
 if(mach.boxes){
  let r=0,d=0;
  if(sp>0){const ph=(((pos-25)%100)+100)%100/100;d=ph>.5?ph-1:ph;if(m==="err"){d+=.28*Math.sin(TT*1.3);d=((d+1.5)%1)-.5}
   r=Math.abs(d)<.12?Math.cos(d/.12*Math.PI/2)*22:0}
  mach.boxes.forEach((b,k)=>{const x=230+((pos+k*100)%500);const q=PART[k];
   if(x<q.px-100){q.mark=null;q.hit=false}q.px=x;b.setAttribute("x",x.toFixed(1));
   const xc=x+15;
   if(r>20&&!q.hit&&Math.abs(xc-570)<22){q.hit=true;q.o=Math.max(-13,Math.min(13,570-xc));q.mark=Math.abs(q.o)<4?"ok":"bad";cnt[q.mark==="ok"?"good":"bad"]++}
   const mk=mach.marks[k];if(q.mark){mk.setAttribute("visibility","visible");mk.setAttribute("x",(xc+q.o-5).toFixed(1));mk.setAttribute("class","mark "+q.mark)}else mk.setAttribute("visibility","hidden")});
  mach.ram.setAttribute("y",(486+r).toFixed(1));
  subT+=dt;if(subT>.25&&mach.cnt){subT=0;mach.cnt.textContent=cnt.good+cnt.bad?T("parts: ","pièces : ")+cnt.good+T(" good, "," bonnes, ")+cnt.bad+T(" scrap"," rebuts"):""}
  if(m==="unsafe"&&!RM)mach.st.setAttribute("opacity",(.55+.45*Math.sin(TT*8)).toFixed(2));else mach.st.setAttribute("opacity","1")}
 requestAnimationFrame(tick)}
requestAnimationFrame(tick);

 if(S.sel==="saf")h+=`<p>${T("How it is built","Conception")} : <b>${esc(ARCH[S.safw])}</b><br><span class="small">${T("To change it, click the SAFE box on the drawing.","Pour la changer, cliquez sur la case SAFE du dessin.")}</span></p><p class="small">${{wire:T("Safety relay and contacts wired in series: nothing on it can be reached by the network. Machine safety, not a cybersecurity point.","Relais de sécurité et contacts câblés en série : rien n'y est joignable par le réseau. C'est de la sécurité machine, pas un point de cybersécurité."),bus:T("The guard goes through a safety controller on a safety fieldbus: programmable and on the network, so cybersecurity matters here too.","Le protecteur passe par un automate de sécurité sur un bus de sécurité : programmable et en réseau, il relève donc aussi de la cybersécurité.")}[S.safw]}</p>`;

function rulesFR(){return `<h2>Réglementation, normes et guides</h2>
<p class="warn small">Résumés avec nos mots, pour l'enseignement. Ce n'est pas une lecture juridique : reportez-vous toujours aux textes officiels (EUR-Lex pour le droit de l'UE, les normes elles-mêmes, les guides de l'ANSSI).</p>
<p class="small">Le règlement fixe des exigences essentielles. Les mesures de cet outil viennent des normes (IEC 62443, ISO 13849) et des bonnes pratiques de l'ANSSI : ce sont des façons de répondre aux exigences, pas des obligations écrites dans le règlement.</p>
<h3>Règlement machines (UE) 2023/1230</h3>
<p class="small">Texte officiel : <a href="https://eur-lex.europa.eu/eli/reg/2023/1230/oj" target="_blank" rel="noopener">EUR-Lex, règlement (UE) 2023/1230</a></p>
<p>Il remplace la directive machines 2006/42/CE. Il s'applique à partir du <b>20 janvier 2027</b> aux machines mises sur le marché ou mises en service à partir de cette date (article 54 ; la première publication indiquait le 14 janvier, un rectificatif l'a reporté au 20). Les logiciels assurant des fonctions de sécurité figurent parmi les composants de sécurité (annexe II, point 18). Il s'adresse aux fabricants, et à quiconque modifie substantiellement une machine.</p>
<p>Deux exigences essentielles de l'<b>annexe III</b> portent sur la cybersécurité :</p>
<ul><li><b>1.1.9 Protection contre la corruption.</b> Raccorder un autre dispositif à la machine, directement ou par un dispositif distant qui communique avec elle, ne doit pas créer de situation dangereuse. Le matériel qui transmet des signaux ou des données et donne accès aux logiciels essentiels à la conformité est protégé de manière adéquate contre la corruption accidentelle ou intentionnelle. Ces logiciels et ces données sont identifiés comme tels et protégés. La machine identifie les logiciels dont elle a besoin pour fonctionner en sécurité et peut fournir cette information à tout moment. Elle recueille la preuve de toute intervention, légitime ou non, dans ce matériel, et de toute intervention dans ses logiciels ou modification de ses logiciels ou de sa configuration.</li>
<li><b>1.2.1 Sécurité et fiabilité des systèmes de commande.</b> Les systèmes de commande doivent éviter toute situation dangereuse. Entre autres, lorsque les circonstances et les risques le justifient, ils résistent aux contraintes d'exploitation prévues et aux influences extérieures, volontaires ou non, y compris aux tentatives malveillantes raisonnablement prévisibles de tiers conduisant à une situation dangereuse. Le journal des données générées lors d'une intervention, et des versions des logiciels de sécurité téléchargés après la mise sur le marché ou la mise en service, reste activé pendant cinq ans après chaque téléchargement, uniquement pour démontrer la conformité sur demande motivée d'une autorité nationale.</li></ul>
<h3>Qui porte les obligations ? Intégrateur, fabricant, utilisateur</h3>
<p>C'est votre rôle qui compte, pas votre métier. Un tableautier, un intégrateur en automatisme ou un constructeur de machines peut se trouver dans chacun de ces cas.</p>
<ul><li><b>Vous réalisez une armoire sur les plans du client.</b> La conception reste à celui qui l'a faite ; le contrat dit qui répond de quoi.</li>
<li><b>Vous concevez l'automatisme, ou vous vendez une armoire ou une machine sous votre nom.</b> Vous pouvez alors être le fabricant, selon ce que vous livrez (une machine complète, une quasi-machine, un composant de machine) et la responsabilité de conception que vous prenez : regardez le contrat et le produit, au cas par cas. En tant que fabricant d'une machine : conformité, y compris les points 1.1.9 et 1.2.1 de l'annexe III. Règlement sur la cyberrésilience (CRA), pour un produit comportant des éléments numériques : évaluation des risques de cybersécurité prise en compte de la planification et de la conception jusqu'à la maintenance (article 13), nomenclature des logiciels (SBOM) établie par le fabricant (annexe I, partie II) et remise à l'autorité de surveillance du marché sur demande motivée, mises à jour de sécurité pendant une période d'assistance qui reflète la durée d'utilisation prévue du produit, au moins cinq ans sauf si le produit est censé servir moins longtemps (article 13), et, depuis le 11 septembre 2026, notification des vulnérabilités activement exploitées, avec une alerte précoce sous 24 heures (article 14). Les machines ne sont pas exclues du CRA (article 2). Son application à une installation unique dépend du cas : à vérifier pour chaque projet.</li>
<li><b>Vous modifiez une machine existante.</b> Une modification par des moyens physiques ou numériques (une modification de programme compte), après la mise sur le marché ou la mise en service, non prévue ou planifiée par le fabricant, qui affecte la sécurité en créant un nouveau danger ou en augmentant le risque existant, au point de rendre nécessaires de nouveaux protecteurs ou dispositifs de protection exigeant de modifier le système de commande de sécurité, ou des mesures supplémentaires de stabilité ou de résistance mécanique, est une <b>modification substantielle</b> (article 3, point 16). Son auteur est considéré comme fabricant, avec les obligations du fabricant : conformité de la machine, déclaration sous sa seule responsabilité, évaluation de la conformité (article 18). Ce n'est pas le cas d'un utilisateur non professionnel qui modifie sa machine pour son propre usage. Une réparation ou une maintenance qui laisse la machine conforme n'est pas une modification substantielle.</li>
<li><b>Votre client relève de NIS 2</b> (énergie, eau, santé, agroalimentaire, transport…). Il doit maîtriser la sécurité de sa chaîne d'approvisionnement, y compris ses relations avec ses fournisseurs et prestataires directs (NIS 2, article 21, paragraphe 2, point d) : attendez-vous à des clauses contractuelles sur la gestion des accès, la traçabilité et les audits. NIS 2 peut aussi viser l'intégrateur lui-même : son annexe II cite la fabrication d'équipements électriques et de machines (divisions 27 et 28 de la NACE), en général à partir des entreprises moyennes (article 2).</li></ul>
<p class="small">Sources : règlement machines, version consolidée du 27 juillet 2026 (articles 3, point 16, et 18) ; règlement sur la cyberrésilience, JO L du 20 novembre 2024 (articles 2, 13, 14, 22, 71, annexe I) ; directive NIS 2 (articles 2 et 21, annexe II) ; focus juridique de l'INRS sur le nouveau règlement machines. Inspiré d'un post professionnel sur les intégrateurs et la réglementation cyber, novembre 2026. Résumés avec nos mots : ils ne remplacent pas l'analyse juridique d'un projet donné.</p>
<h3>Norme EN 50742 (protection contre la corruption)</h3>
<p>Le CENELEC (comité TC 44X) a élaboré <i>Sécurité des machines : protection contre la corruption</i>, pour donner une façon de répondre aux points 1.1.9 et 1.2.1. Elle a été approuvée formellement le 9 octobre 2026, et sa publication européenne était annoncée pour le 20 novembre 2026 ; les versions nationales (NF EN en France) suivent plus tard. La présomption de conformité au règlement ne vient qu'une fois sa référence citée au Journal officiel de l'UE : non vérifiée au 22 novembre 2026. Elle décrit une démarche fondée sur les risques, avec des niveaux de sécurité liés à la sécurité des personnes, propres à la machine ou fondés sur l'IEC 62443.</p>
<h3>Règlement sur la cyberrésilience (CRA), règlement (UE) 2024/2847</h3>
<p class="small">Texte officiel : <a href="https://eur-lex.europa.eu/eli/reg/2024/2847/oj" target="_blank" rel="noopener">EUR-Lex, règlement (UE) 2024/2847</a></p>
<p>Pour les produits comportant des éléments numériques dont l'utilisation prévue ou raisonnablement prévisible comprend une connexion à un dispositif ou à un réseau (article 2) : automates, pupitres opérateur, switchs, logiciels. Il s'adresse à leurs fabricants (sécurité dès la conception, mises à jour, gestion des vulnérabilités). Celui qui, sans être le fabricant, apporte une modification substantielle à un tel produit et le met à disposition sur le marché est considéré comme son fabricant (article 22) ; le CRA a sa propre définition de la modification substantielle : une modification qui a une incidence sur la conformité aux exigences de cybersécurité, ou qui change l'utilisation prévue (article 3, point 30). Il s'applique à partir du 11 décembre 2027 ; l'article 14 (signalement) depuis le 11 septembre 2026 (article 71).</p>
<h3>IEC 62443</h3>
<p>La famille de normes sur la sécurité des automatismes et systèmes de commande industriels. Vocabulaire repris dans l'outil : <b>zones</b> (groupes d'appareils ayant les mêmes besoins de sécurité) et <b>conduits</b> (chemins maîtrisés entre zones), niveaux de sécurité, défense en profondeur.</p>
<h3>ANSSI (Agence nationale de la sécurité des systèmes d'information)</h3>
<p class="small">Site : <a href="https://cyber.gouv.fr" target="_blank" rel="noopener">cyber.gouv.fr</a></p>
<p>Guides sur la cybersécurité des systèmes industriels (classement des installations en trois classes selon les conséquences d'une attaque, et mesures correspondantes), guide d'hygiène informatique, et réflexes face à un rançongiciel : isoler la machine infectée du réseau, prévenir le référent informatique, ne pas payer, porter plainte. Sur l'extinction, la fiche réflexe InterCERT France « Compromission système – Endiguement » est plus précise : veille prolongée si possible, extinction seulement en dernier recours, quand la machine ne peut pas être déconnectée.</p>
<h3>Directive NIS 2 (UE) 2022/2555</h3>
<p>Elle vise des organisations (entités essentielles ou importantes), pas des machines. Les États membres devaient la transposer au plus tard le 17 octobre 2024 et l'appliquer à partir du 18 octobre 2024 ; vérifiez où en est la loi nationale avant de l'enseigner. Parmi les mesures que doit prendre chaque entité (article 21) : analyse des risques, gestion des incidents, continuité d'activité et sauvegardes, sécurité de la chaîne d'approvisionnement, cyberhygiène de base et formation.</p>
<h3>Quelle mesure répond à quoi</h3>
<table><tr><th>Mesure de l'outil</th><th>D'où elle vient</th></tr>${M.map(m=>`<tr><td>${esc(m.n)}</td><td>${esc(m.r)}</td></tr>`).join("")}</table>
<p class="small">Règlement machines : annexe III, 1.1.9 et 1.2.1, article 3, point 16, articles 18 et 54 et annexe II relus le 20 novembre 2026 sur la version consolidée française du 27 juillet 2026 (EUR-Lex, CELEX 02023R1230-20260727). Les passages cités du CRA (JO L du 20 novembre 2024) et de NIS 2 (directive (UE) 2022/2555) ont été relus le même jour sur leurs textes officiels en français.</p>
<p class="small">RM = règlement machines 2023/1230, annexe III. ISO 13849 = parties des systèmes de commande relatives à la sécurité. Le tableau donne le lien que nous enseignons, pas une correspondance officielle.</p>`}
function aboutFR(){return `<h2>Cyber Workshop v${VERSION}</h2>
<p>Une initiation concrète à la cybersécurité des machines automatisées et des réseaux industriels. Pas de cours magistral : on observe un atelier, on y joue des attaques et on gère un incident.</p>
<h3>Objectifs d'apprentissage</h3>
<ul><li>Repérer les faiblesses courantes d'une machine automatisée, et voir comment elles augmentent à mesure qu'elle se connecte (machine seule, réseau de l'usine, télémaintenance).</li>
<li>Expliquer où une mesure agit sur le chemin d'une attaque, et ce qu'elle coûte à la production.</li>
<li>Distinguer empêcher une attaque, limiter son impact et reprendre la production ; distinguer cybersécurité, sécurité machine et sûreté de fonctionnement.</li>
<li>Appliquer les premiers réflexes en cas d'incident.</li>
<li>Connaître ce que le règlement machines exige en cybersécurité, et quand on devient fabricant.</li></ul>
<h3>Architecture</h3>
<p>Deux choix fixent l'architecture. <b>Raccordement</b> : la <b>machine seule</b> (automate, pupitre opérateur, variateur, sécurité du protecteur, un portable de programmation de temps en temps), ou raccordée au <b>réseau de l'usine</b> (supervision, MES / ERP, PC de bureau, internet). <b>Télémaintenance</b> : aucune, <b>par le réseau de l'usine</b> (routeur internet et passerelle distante), ou par un <b>modem 4G sur la machine</b>, avec sa propre carte SIM, qui contourne le réseau de l'usine. Chaque choix ajoute des portes d'entrée ; les failles, les scénarios et les mesures suivent.</p>
<h3>1 · Chasse aux failles</h3>
<p>Cliquez sur un équipement ; pour chaque ligne, choisissez <b>Faille</b> ou <b>Correct</b>. Chaque réponse est accompagnée de la bonne pratique. <b>Appliquer la mesure</b> l'active pour les attaques. Une mesure couvre toutes les failles du même type : quand elle est déjà active, la ligne indique <b>Déjà appliquée</b> et d'où elle vient. Un nouveau clic la retire partout.</p>
<h3>2 · Attaques</h3>
<p>Deux onglets : <b>Entraînement</b> (scénarios théoriques) et <b>Cas réels</b>. Trois temps. <b>1 · Choisir les mesures</b> : au départ, celles de la chasse ; boutons Aucune, Mes mesures (chasse), Toutes. <b>2 · Regarder l'attaque</b> : pas à pas ou tout d'un coup ; la ligne rouge en pointillé montre où va l'attaque, un bouclier vert la barrière qui l'a arrêtée. <b>3 · Lire le résultat</b> : empêchée, détectée, impact, reprise ; puis changez les mesures et rejouez. Le débriefing sépare ce qui a été observé (l'étape passée, l'étape qui a arrêté l'attaque) des étapes non atteintes et de leurs barrières possibles. Chaque essai est conservé avec les mesures en place à ce moment : rejouez la même attaque sans, puis avec une mesure, et le rapport montre les deux essais.</p>
<h3>Sécurité du protecteur</h3>
<p>Cliquez sur <b>choisir</b>, sur la case SAFE du dessin, pour choisir la conception de la sécurité du protecteur. <b>Sécurité câblée</b> (relais, contacts en série) : rien n'est joignable par le réseau, c'est de la sécurité machine plutôt que de la cybersécurité. <b>Automate de sécurité / bus</b> : la sécurité passe par un automate programmable en réseau, qui devient un sujet de cybersécurité (SAF : est-il protégé ?). Qu'une fonction de sécurité limite ou non l'impact d'une attaque dépend de l'architecture et du danger : chaque scénario dit quelle fonction agit, ou pourquoi aucune n'agit.</p>
<h3>Cas réels</h3>
<p>Onglet <b>Cas réels</b> du mode 2 : chaque cas s'ouvre sur ce qui s'est passé, puis se rejoue sur l'atelier avec vos mesures. Huit cas : Stuxnet (2010), l'aciérie allemande (2014), le réseau électrique ukrainien (2015), TRITON (2017), un rançongiciel chez un producteur d'aluminium (2019), l'oléoduc arrêté par précaution (2021), et deux attaques réelles (une station de surpression d'eau aux États-Unis en 2023, le froid de supermarchés en Europe en 2026). Chacun dit ce que l'on sait, ce que l'on ignore et d'où viennent les informations. Les étapes sont simplifiées et jouées sur le dessin de l'atelier.</p>
<h3>3 · Exercice d'incident</h3>
<p>L'attaque a eu lieu. L'heure avance à chaque décision : choisissez quoi faire, étape par étape ; chaque réponse est expliquée et la machine du dessin suit vos choix. Le résultat sépare les connaissances (bons choix) de ce que vos défenses vous ont permis de réaliser sans entrave.</p>
<h3>4 · Règlement</h3>
<p>L'essentiel du volet cybersécurité du règlement machines (dates, points 1.1.9 et 1.2.1, modification substantielle, logiciels de sécurité), puis douze cas à trancher (dix sur le règlement machines, deux sur le CRA), chacun expliqué à partir du texte officiel.</p>
<h3>Barre de protection</h3>
<p>Au-dessus du dessin : mesures en place, attaques arrêtées (chaque scénario possible rejoué en silence avec vos mesures), et la couleur sous chaque équipement : couvert, en partie, non couvert, non examiné dans la chasse.</p>
<h3>Rapport</h3>
<p>Télécharge un compte rendu texte de la séance : niveau, chasse aux failles, mesures, essais d'attaque, incidents, cas du règlement.</p>
<h3>Limites</h3>
<p>Une simulation pédagogique : aucun véritable outil d'attaque, aucun accès réseau, rien ne sort de cette page. Les scénarios sont simplifiés et déterministes : ici une mesure arrête une étape ou non, alors qu'en réalité une mesure réduit un risque, jamais jusqu'à zéro. L'animation de la machine montre l'effet, pas un procédé réel. Les résumés réglementaires sont les nôtres : lisez les textes officiels.</p>
<h3>Crédits</h3>
<p class="small">Idée et cahier des charges : Philippe RAYMOND. Code : Claude (Anthropic). Sources réglementaires : règlements (UE) 2023/1230 et 2024/2847, IEC 62443, guides de l'ANSSI, INRS (résumés, voir Réglementation). Cas réels : sources de presse et d'agences citées dans chaque cas.</p>
<p class="small">© 2026 Philippe RAYMOND · Licence CC BY-NC-ND 4.0<br>Version officielle : phil-legacy.github.io/toolbox</p>`}

 $("#stageDesc").textContent=archDesc();
 stopPlay();if(S.sel&&!ok(DEV[S.sel].st))S.sel=null;if(S.atk&&!ok(SC.find(x=>x.id===S.atk.id).st))S.atk=null;if(S.inc&&!ok(INC.find(x=>x.id===S.inc.id).st))S.inc=null;
 if(S.mode==="attack"){ensureAtk();newAtk(S.atk.id)}if(S.mode==="incident")ensureInc();if(S.mode==="hunt"||S.mode==="reg")setMachine("run");draw();renderSide()}

function rulesEN(){return `<h2>Rules, standards and guides</h2>
<p class="warn small">Summaries in our own words, for teaching. They are not a legal reading: always go back to the official texts (EUR-Lex for EU law, the standards themselves, the ANSSI guides).</p>
<p class="small">The Regulation sets essential requirements. The measures in this tool come from standards (IEC 62443, ISO 13849) and from ANSSI good practice: they are one way to meet the requirements, not obligations written in the Regulation.</p>
<h3>Machinery Regulation (EU) 2023/1230</h3>
<p class="small">Official text: <a href="https://eur-lex.europa.eu/eli/reg/2023/1230/oj" target="_blank" rel="noopener">EUR-Lex, Regulation (EU) 2023/1230</a></p>
<p>Replaces the Machinery Directive 2006/42/EC. It applies from <b>20 January 2027</b> to machinery placed on the market or put into service from that date (Article 54; the first publication said 14 January, a corrigendum moved it to the 20th). Software that performs safety functions is listed as a safety component (Annex II, point 18). It is addressed to manufacturers, and to whoever substantially modifies a machine.</p>
<p>Two essential requirements of <b>Annex III</b> deal with cybersecurity:</p>
<ul><li><b>1.1.9 Protection against corruption.</b> Connecting another device to the machine, directly or through a remote device that communicates with it, must not create a hazardous situation. Hardware that carries signals or data and gives access to the software essential for compliance must be adequately protected against accidental or intentional corruption. That software and those data must be identified as such and protected. The machine must identify the software it needs to work safely and be able to show this information at any time. It must collect evidence of any intervention, legitimate or not, in that hardware, and of any intervention in or change of its software or configuration.</li>
<li><b>1.2.1 Safety and reliability of control systems.</b> Control systems must avoid any hazardous situation. Among other points, where the circumstances and risks justify it, they must withstand the intended operating stresses and external influences, intentional or not, including reasonably foreseeable malicious attempts by third parties leading to a hazardous situation. The log of data generated by an intervention, and of the versions of safety software uploaded after the machine was placed on the market or put into service, must be kept enabled for five years after each upload, only to show compliance when a national authority asks for it.</li></ul>
<h3>Who carries the obligations? Integrator, manufacturer, user</h3>
<p>Your role decides, not your job title. A cabinet builder, an automation integrator or a machine builder can be in any of these cases.</p>
<ul><li><b>You build a cabinet to the customer's drawings.</b> The design stays with whoever made it; the contract says who answers for what.</li>
<li><b>You design the automation, or you sell a cabinet or a machine under your own name.</b> You may then be the manufacturer, depending on what you deliver (a complete machine, a partly completed machine, a component of a machine) and on the design responsibility you take: look at the contract and at the product, case by case. As manufacturer of a machine: conformity, including Annex III 1.1.9 and 1.2.1. Cyber Resilience Act, for a product with digital elements: a cybersecurity risk assessment taken into account from planning and design to maintenance (Article 13), a software bill of materials (SBOM) drawn up by the manufacturer (Annex I, Part II) and handed to the market surveillance authority on reasoned request, security updates over a support period that reflects the expected period of use of the product, at least five years unless it is expected to be used for less (Article 13), and, since 11 September 2026, notification of actively exploited vulnerabilities, with an early warning within 24 hours (Article 14). Machinery is not excluded from the CRA (Article 2). Whether it applies to a one-off installation depends on the case: check it for each project.</li>
<li><b>You modify an existing machine.</b> A change made by physical or digital means (a program change counts) after the machine was placed on the market or put into service, not foreseen or planned by the manufacturer, that affects safety by creating a new hazard or increasing an existing risk, so that new guards or protective devices requiring a change of the safety control system, or extra measures for stability or mechanical strength, become necessary, is a <b>substantial modification</b> (Article 3, point 16). Whoever makes it is considered the manufacturer, with the manufacturer's obligations: conformity of the machine, declaration under their own responsibility, conformity assessment (Article 18). A non-professional user modifying a machine for their own use is not. Repair and maintenance that keep the machine compliant are not substantial modifications.</li>
<li><b>Your customer falls under NIS 2</b> (energy, water, health, food, transport…). The customer must manage the security of its supply chain, including the relationships with its direct suppliers and service providers (NIS 2, Article 21(2)(d)): expect contract clauses on access management, traceability and audits. NIS 2 may also concern the integrator itself: its Annex II lists the manufacture of electrical equipment and of machinery (NACE divisions 27 and 28), in general from medium-sized companies upwards (Article 2).</li></ul>
<p class="small">Sources: Machinery Regulation, consolidated text of 27 July 2026 (Articles 3(16) and 18); Cyber Resilience Act, OJ L of 20 November 2024 (Articles 2, 13, 14, 22, 71, Annex I); NIS 2 Directive (Articles 2 and 21, Annex II); INRS legal focus on the new Machinery Regulation. Inspired by a professional post on integrators and cyber regulation, November 2026. Summaries in our words: they do not replace a legal analysis of a given project.</p>
<h3>Standard EN 50742 (protection against corruption)</h3>
<p>CENELEC (committee TC 44X) has drawn up <i>Safety of machinery: protection against corruption</i>, to give a way of meeting 1.1.9 and 1.2.1. It was formally approved on 9 October 2026, and its European publication was announced for 20 November 2026; the national versions (NF EN in France) follow later. A presumption of conformity with the Regulation only comes once its reference is cited in the Official Journal of the EU: not confirmed on 22 November 2026. It describes a risk-based approach with safety-related security levels, either machine-specific or based on IEC 62443.</p>
<h3>Cyber Resilience Act, Regulation (EU) 2024/2847</h3>
<p class="small">Official text: <a href="https://eur-lex.europa.eu/eli/reg/2024/2847/oj" target="_blank" rel="noopener">EUR-Lex, Regulation (EU) 2024/2847</a></p>
<p>For products with digital elements whose intended or reasonably foreseeable use includes a connection to a device or a network (Article 2): PLCs, operator panels, switches, software. It is addressed to their manufacturers (secure by design, updates, vulnerability handling). Whoever, other than the manufacturer, substantially modifies such a product and makes it available on the market is considered its manufacturer (Article 22); the CRA defines its own substantial modification: a change that affects compliance with the cybersecurity requirements or changes the intended use (Article 3, point 30). It applies from 11 December 2027; Article 14 (reporting) from 11 September 2026 (Article 71).</p>
<h3>IEC 62443</h3>
<p>The family of standards for industrial automation and control systems security. Vocabulary used in this tool: <b>zones</b> (groups of devices with the same security needs) and <b>conduits</b> (the controlled paths between zones), security levels, defence in depth.</p>
<h3>ANSSI (French national cybersecurity agency)</h3>
<p class="small">Website: <a href="https://cyber.gouv.fr" target="_blank" rel="noopener">cyber.gouv.fr</a></p>
<p>Guides on the cybersecurity of industrial control systems (classification of installations into three classes according to the consequences of an attack, and the matching measures), the IT hygiene guide, and the ransomware reflexes: isolate the infected machine from the network, warn your IT contact, do not pay, file a complaint. On switching off, the InterCERT France reflex sheet "System compromise: containment" is more precise: hibernation if possible, switching off only as a last resort when the machine cannot be disconnected.</p>
<h3>NIS 2 Directive (EU) 2022/2555</h3>
<p>Concerns organisations (essential or important entities), not machines. Member States had to transpose it by 17 October 2024 and apply it from 18 October 2024; check where the national law stands before teaching it. Among the measures every entity must take (Article 21): risk analysis, incident handling, business continuity and backups, supply chain security, basic cyber hygiene and training.</p>
<h3>Which measure answers what</h3>
<table><tr><th>Measure in the tool</th><th>Where it comes from</th></tr>${M.map(m=>`<tr><td>${esc(m.n)}</td><td>${esc(m.r)}</td></tr>`).join("")}</table>
<p class="small">Machinery Regulation: Annex III 1.1.9 and 1.2.1, Article 3(16), Articles 18 and 54 and Annex II re-read on 20 November 2026 against the consolidated French text of 27 July 2026 (EUR-Lex, CELEX 02023R1230-20260727). The CRA (OJ L of 20 November 2024) and NIS 2 (Directive (EU) 2022/2555) passages quoted were re-read the same day against their official French texts.</p>
<p class="small">RM = Machinery Regulation 2023/1230, Annex III. ISO 13849 = safety-related parts of control systems. The table shows the link we teach, not an official mapping.</p>`}
